/* ── Utility ───────────────────────────────────────────────── */
function noteExcerpt(c) { return (c||'').replace(/[#*`\[\]>|_\-~]/g,'').replace(/\n+/g,' ').trim().slice(0,120); }
function noteWC(c) { return (c||'').split(/\s+/).filter(Boolean).length; }
function timeAgo(ts) {
  const d = Date.now()-ts, m=Math.floor(d/60000), h=Math.floor(d/3600000), j=Math.floor(d/86400000);
  if(m<1) return "À l'instant"; if(m<60) return m+' min'; if(h<24) return h+' h'; if(j<30) return j+' j'; if(j<365) return Math.floor(j/30)+' mois'; return Math.floor(j/365)+' an'+(Math.floor(j/365)>1?'s':'');
}
function escH(s) { return typeof escHtml==='function'?escHtml(s):String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

/* ── Markdown Renderer ─────────────────────────────────────── */
function mdRender(md) {
  if(!md) return '';
  let h = md;
  // code blocks
  h = h.replace(/```(\w*)\n([\s\S]*?)```/g, (_,lang,code)=>'<pre style="background:#141414;border:1px solid #2b2b2b;border-radius:8px;padding:12px;overflow-x:auto;margin:8px 0"><code'+(lang?' class="language-'+lang+'"':'')+'>'+escH(code.trim())+'</code></pre>');
  // inline code
  h = h.replace(/`([^`]+)`/g,'<code style="background:#141414;padding:2px 6px;border-radius:4px;font-size:0.9em">$1</code>');
  // headings
  h = h.replace(/^### (.+)$/gm,'<h3 style="font-size:1.1em;color:#c9a97e;margin:12px 0 4px;font-family:Antonio,sans-serif;letter-spacing:0.04em">$1</h3>');
  h = h.replace(/^## (.+)$/gm,'<h2 style="font-size:1.3em;color:#f2ead8;margin:16px 0 6px;font-family:Antonio,sans-serif;letter-spacing:0.04em">$1</h2>');
  h = h.replace(/^# (.+)$/gm,'<h1 style="font-size:1.6em;color:#ff9c00;margin:20px 0 8px;font-family:Antonio,sans-serif;letter-spacing:0.05em">$1</h1>');
  // bold + italic
  h = h.replace(/\*\*\*(.+?)\*\*\*/g,'<strong><em>$1</em></strong>');
  h = h.replace(/\*\*(.+?)\*\*/g,'<strong style="color:#f2ead8">$1</strong>');
  h = h.replace(/\*(.+?)\*/g,'<em>$1</em>');
  // strikethrough
  h = h.replace(/~~(.+?)~~/g,'<del>$1</del>');
  // hr
  h = h.replace(/^---+$/gm,'<hr style="border:none;border-top:1px solid #2b2b2b;margin:16px 0">');
  // blockquote
  h = h.replace(/^> (.+)$/gm,'<blockquote style="border-left:3px solid #ff9c00;padding:4px 12px;margin:8px 0;color:#c9a97e;font-style:italic">$1</blockquote>');
  // table
  h = h.replace(/^(\|.+\|)\n(\|[-| :]+\|)\n((?:\|.+\|\n?)*)/gm, (_,hdr,sep,body)=>{
    const ths=hdr.split('|').filter(Boolean).map(t=>'<th style="padding:6px 10px;border:1px solid #2b2b2b;color:#ff9c00;text-align:left;font-family:Antonio,sans-serif;letter-spacing:0.04em">'+t.trim()+'</th>').join('');
    const rows=body.trim().split('\n').map(r=>{
      const tds=r.split('|').filter(Boolean).map(t=>'<td style="padding:6px 10px;border:1px solid #2b2b2b;color:#c9a97e">'+t.trim()+'</td>').join('');
      return '<tr>'+tds+'</tr>';
    }).join('');
    return '<table style="border-collapse:collapse;margin:8px 0;width:100%"><thead><tr>'+ths+'</tr></thead><tbody>'+rows+'</tbody></table>';
  });
  // checklist
  h = h.replace(/^- \[x\] (.+)$/gm,'<div style="margin:2px 0"><label style="color:#5fbf8f;cursor:default"><input type="checkbox" checked disabled style="margin-right:6px;accent-color:#ff9c00">$1</label></div>');
  h = h.replace(/^- \[ \] (.+)$/gm,'<div style="margin:2px 0"><label style="color:#c9a97e;cursor:default"><input type="checkbox" disabled style="margin-right:6px;accent-color:#ff9c00">$1</label></div>');
  // unordered list
  h = h.replace(/^- (.+)$/gm,'<li style="color:#c9a97e;margin:2px 0 2px 16px">$1</li>');
  // ordered list
  h = h.replace(/^\d+\. (.+)$/gm,'<li style="color:#c9a97e;margin:2px 0 2px 16px;list-style-type:decimal">$1</li>');
  // links
  h = h.replace(/\[(.+?)\]\((.+?)\)/g,'<a href="$2" style="color:#ff9c00;text-decoration:underline" target="_blank">$1</a>');
  // paragraphs
  h = h.replace(/\n{2,}/g,'<br><br>');
  h = h.replace(/\n/g,'<br>');
  return h;
}

    return `<div onclick="NS.selectedNoteId='${x.id}';rNoteEditor()" style="padding:10px 12px;border-radius:8px;cursor:pointer;border:1px solid ${sel?'#ff9c00':'transparent'};background:${sel?'rgba(255,156,0,0.08)':'transparent'};margin-bottom:4px;transition:all .15s" onmouseover="this.style.background='rgba(255,156,0,0.05)'" onmouseout="this.style.background='${sel?'rgba(255,156,0,0.08)':'transparent'}'">

  // Set up slash command listener

/* ── Editor keyboard shortcuts ─────────────────────────────── */
function nEditorKeyHandler(e) {
  if (S.v !== 'notes' || !NS.isEditorOpen) return;
  const isMod = e.ctrlKey || e.metaKey;
  if (isMod && e.key === 'p') { e.preventDefault(); nPrintNote(NS.selectedNoteId); }
  if (isMod && e.shiftKey && e.key === 'Delete') { e.preventDefault(); nDeleteConfirm(NS.selectedNoteId); }
  if (isMod && e.shiftKey && e.key === 'C') { e.preventDefault(); nCopyContent(NS.selectedNoteId); }
  if (isMod && e.key === 'Backslash') { e.preventDefault(); NS.isFullscreen=!NS.isFullscreen; rNoteEditor(); }
  if (e.key === 'Escape' && NS.isFullscreen) { NS.isFullscreen=false; rNoteEditor(); }
}

/* ── Markdown insertion ────────────────────────────────────── */
function nInsertMd(md, mdEnd, isPre, isLine) {
  const ta = document.getElementById('nContent');
  if (!ta) return;
  const start = ta.selectionStart;
  const end = ta.selectionEnd;
  const val = ta.value;
  const sel = val.substring(start, end);

  if (isLine) {
    // Find line start
    const lineStart = val.lastIndexOf('\n', start-1)+1;
    const lineEnd = val.indexOf('\n', end);
    const line = val.substring(lineStart, lineEnd===-1?val.length:lineEnd);
    const before = val.substring(0, lineStart);
    const after = val.substring(lineEnd===-1?val.length:lineEnd);
    const newLine = md + line + (mdEnd||'');
    ta.value = before + newLine + after;
    ta.selectionStart = ta.selectionEnd = lineStart + newLine.length;
  } else {
    const replacement = md + sel + (mdEnd||'');
    ta.value = val.substring(0, start) + replacement + val.substring(end);
    ta.selectionStart = start + md.length;
    ta.selectionEnd = start + md.length + sel.length;
  }
  ta.focus();
  nUpdateContent(NS.selectedNoteId, ta.value);
}

/* ── Slash Commands ────────────────────────────────────────── */
const SLASH_ITEMS = [
  { label:'Titre 1',  icon:'fa-heading', md:'# ',   desc:'Grand titre' },
  { label:'Titre 2',  icon:'fa-heading', md:'## ',  desc:'Titre moyen', suffix:'2' },
  { label:'Titre 3',  icon:'fa-heading', md:'### ', desc:'Petit titre', suffix:'3' },
  { label:'Liste',     icon:'fa-list-ul', md:'- ',   desc:'Liste à puces' },
  { label:'Liste numérotée', icon:'fa-list-ol', md:'1. ', desc:'Liste numérotée' },
  { label:'Citation',  icon:'fa-quote-left', md:'> ', desc:'Bloc de citation' },
  { label:'Code bloc', icon:'fa-code', md:'```\n', desc:'Bloc de code', mdEnd:'\n```' },
  { label:'Checklist', icon:'fa-square-check', md:'- [ ] ', desc:'Liste de tâches' },
  { label:'Séparateur',icon:'fa-minus', md:'---\n', desc:'Ligne horizontale' },
  { label:'Tableau',   icon:'fa-table', md:'| Col1 | Col2 | Col3 |\n|------|------|------|\n| ', desc:'Tableau', mdEnd:' | data | data |' },
];

function nSlashHandler(e) {
  if (e.key === 'Escape') { nHideSlash(); return; }
  const menu = document.getElementById('nSlashMenu');
  if (!menu || menu.classList.contains('hidden')) return;
  if (e.key === 'Enter') {
    e.preventDefault();
    const sel = menu.querySelector('[data-slash-sel="true"]') || menu.querySelector('[data-slash-idx="0"]');
    if (sel) sel.click();
    nHideSlash();
  } else if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    e.preventDefault();
    const items = menu.querySelectorAll('[data-slash-idx]');
    let cur = -1;
    items.forEach((it,i)=>{ if(it.dataset.slashSel==='true') cur=i; });
    items.forEach(it=>it.dataset.slashSel='false');
    const next = e.key==='ArrowDown' ? (cur+1)%items.length : (cur-1+items.length)%items.length;
    const target = items[next];
    if (target) { target.dataset.slashSel='true'; target.style.background='#1a1a1a'; }
    items.forEach((it,i)=>{ if(i!==next) it.style.background='none'; });
  }
}

function nSlashInput(e) {
  const ta = e.target;
  const val = ta.value;
  const pos = ta.selectionStart;
  // Find slash before cursor
  const before = val.substring(0, pos);
  const slashIdx = before.lastIndexOf('/');
  if (slashIdx === -1 || (slashIdx > 0 && before[slashIdx-1] !== '\n' && before[slashIdx-1] !== ' ')) { nHideSlash(); return; }
  // Check if there's a newline between slash and cursor
  const between = before.substring(slashIdx+1);
  if (between.includes('\n')) { nHideSlash(); return; }
  const query = between.toLowerCase().trim();
  const menu = document.getElementById('nSlashMenu');
  if (!menu) return;

  const filtered = SLASH_ITEMS.filter(it=>it.label.toLowerCase().includes(query) || it.desc.toLowerCase().includes(query));
  if (filtered.length === 0) { nHideSlash(); return; }

  NS._slashRange = { start: slashIdx, end: pos };
  menu.classList.remove('hidden');

  // Position: estimate from textarea
  const linesBefore = val.substring(0, slashIdx).split('\n');
  const lineCount = linesBefore.length;
  const topOffset = 40 + lineCount * 24;
  menu.style.top = topOffset + 'px';

  menu.innerHTML = filtered.map((it,i)=>`
    <div data-slash-idx="${i}" data-slash-sel="${i===0}" onclick="nSlashSelect(${SLASH_ITEMS.indexOf(it)})" style="display:flex;align-items:center;gap:10px;padding:8px 14px;cursor:pointer;transition:background .1s;${i===0?'background:#1a1a1a':''}" onmouseover="this.style.background='#1a1a1a'" onmouseout="this.style.background='${i===0?'#1a1a1a':'none'}'">
      <i class="fa-solid ${it.icon}" style="width:18px;color:#ff9c00;font-size:0.8rem"></i>
      <div><div style="font-size:0.82rem;color:#f2ead8">${escH(it.label)}</div><div style="font-size:0.68rem;color:#666">${escH(it.desc)}</div></div>
    </div>
  `).join('');
}

function nSlashSelect(idx) {
  const item = SLASH_ITEMS[idx];
  if (!item || !NS._slashRange) return;
  const ta = document.getElementById('nContent');
  if (!ta) return;
  const {start, end} = NS._slashRange;
  const val = ta.value;
  const mdEnd = item.mdEnd || '';
  ta.value = val.substring(0, start) + item.md + mdEnd + val.substring(end);
  ta.selectionStart = ta.selectionEnd = start + item.md.length;
  ta.focus();
  nUpdateContent(NS.selectedNoteId, ta.value);
  nHideSlash();
}

function nHideSlash() {
  const menu = document.getElementById('nSlashMenu');
  if (menu) menu.classList.add('hidden');
  NS._slashRange = null;
}

/* ── Copy content to clipboard ─────────────────────────────── */
function nCopyContent(id) {
  const n = ND.notes.find(x=>x.id===id);
  if(!n) return;
  const text = (n.title?'# '+n.title+'\n\n':'')+(n.content||'');
  navigator.clipboard.writeText(text).then(()=>{
    if(typeof toast==='function') toast('Contenu copié dans le presse-papier','fa-copy');
  }).catch(()=>{
    // Fallback
    const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);
    if(typeof toast==='function') toast('Contenu copié','fa-copy');
  });
}

/* ── Export Note as Markdown ───────────────────────────────── */
function nExportNote(id) {
  const n = ND.notes.find(x=>x.id===id);
  if(!n) return;
  const blob = new Blob(['# '+n.title+'\n\n'+(n.content||'')], {type:'text/markdown'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = (n.title||'note').replace(/[^a-zA-Z0-9àâéèêëïîôùûüç\-]/g,'_')+'.md';
  a.click();
  URL.revokeObjectURL(a.href);
  if(typeof toast==='function') toast('Note exportée','fa-download');
}

/* ── Duplicate Note ────────────────────────────────────────── */
function nDuplicateNote(id) {
  const n = ND.notes.find(x=>x.id===id);
  if(!n) return;
  const dup = Object.assign({}, n, {
    id: 'n'+Date.now(),
    title: (n.title||'')+' (copie)',
    tagIds: (n.tagIds||[]).slice(),
    isPinned: false,
    createdAt: Date.now(),
    updatedAt: Date.now()
  });
  ND.notes.unshift(dup);
  svNotesData();
  if(typeof toast==='function') toast('Note dupliquée','fa-copy');
  rNotes();
}

/* --- Quill Editor --- */
var _mkQuill=null;
window.mkInitQuill=function(htmlContent){
  ensureQuill(function(){
    try{
      var el=document.getElementById('mkeQuill');
      if(!el)return;
      if(_mkQuill){try{_mkQuill.off('text-change');}catch(e){}_mkQuill=null;}
      if(typeof Quill==='undefined'){console.warn('Quill not loaded');return;}
      _mkQuill=new Quill(el,{
        theme:'snow',
        placeholder:'Bonjour {{prenom}},\n\nVotre message ici...',
        modules:{toolbar:[['bold','italic','underline','strike'],[{'header':[1,2,3,false]}],[{'list':'ordered'},{'list':'bullet'}],['blockquote','link'],['clean']]}
      });
      if(htmlContent&&htmlContent.trim()){
        var isPlain=!/<[a-z][\s\S]*>/i.test(htmlContent);
        if(isPlain){_mkQuill.setText(htmlContent);}else{_mkQuill.root.innerHTML=htmlContent;}
      }
      _mkQuill.on('text-change',function(){
        if(window._mkCampSend)window._mkCampSend.item.body=_mkQuill.root.innerHTML;
        var prevEl=document.getElementById('mkePreviewContent');
        if(prevEl){var txt=_mkQuill.getText().substring(0,300);prevEl.textContent=txt||'(Aucun contenu)';}
      });
    }catch(e){console.error('mkInitQuill error:',e);}
  });
};
window.mkGetQuillHTML=function(){
  if(_mkQuill){try{return _mkQuill.root.innerHTML;}catch(e){}}
  if(window._mkCampSend)return window._mkCampSend.item.body||'';
  return'';
};
window.mkApplyTemplate=function(tplId){
  var tpl=window.MK_EMAIL_TEMPLATES.find(function(t){return t.id===tplId});
  if(!tpl)return;
  if(window._mkCampSend){
    if(tpl.subject)window._mkCampSend.item.subject=tpl.subject;
    window._mkCampSend.item.body=tpl.body;
    var subEl=document.getElementById('mkeSubject');
    if(subEl&&tpl.subject)subEl.value=tpl.subject;
  }
  if(_mkQuill){
    var isPlain=!/<[a-z][\s\S]*>/i.test(tpl.body);
    if(isPlain){_mkQuill.setText(tpl.body);}else{_mkQuill.root.innerHTML=tpl.body;}
  }
  var prevEl=document.getElementById('mkePreviewContent');
  if(prevEl){var txt=(tpl.body||'').replace(/<[^>]*>/g,'').substring(0,300);prevEl.textContent=txt||'(Aucun contenu)';}
  toast('Template \"'+tpl.name+'\" appliqué','ok');
};

/* --- Tag grouping --- */
window.mkGetGroupedTags=function(){
  var allTags=mkGetAllTags();
  var icons={'prospect':'fa-user-plus','client':'fa-handshake','partenaire':'fa-people-arrows','fournisseur':'fa-truck','collègue':'fa-building','lead':'fa-magnet','vip':'fa-crown'};
  var grouped=[];var catMap={};
  allTags.forEach(function(t){
    var cat='Autres';var tl=t.toLowerCase();
    Object.keys(icons).forEach(function(k){if(tl.indexOf(k)!==-1)cat=k.charAt(0).toUpperCase()+k.slice(1)});
    if(!catMap[cat])catMap[cat]=[];
    catMap[cat].push(t);
  });
  Object.keys(catMap).sort().forEach(function(cat){grouped.push({label:cat,icon:icons[cat.toLowerCase()]||'fa-tag',tags:catMap[cat]});});
  return grouped;
};

/* --- Tag toggle --- */
window.mkToggleCampTag=function(tag){
  if(!window._mkCampSend._selTags)window._mkCampSend._selTags=[];
  var arr=window._mkCampSend._selTags;
  var idx=arr.indexOf(tag);if(idx>=0)arr.splice(idx,1);else arr.push(tag);
  mkCampaignComposeModal();
};
window.mkSelectAllTags=function(){window._mkCampSend._selTags=mkGetAllTags();mkCampaignComposeModal();};

/* --- Manual email --- */
window.mkAddManualEmail=function(){
  var inp=document.getElementById('mkeManualEmail');
  if(!inp)return;
  var email=inp.value.trim();
  if(!email||email.indexOf('@')===-1){toast('Email invalide','err');return;}
  if(!window._mkCampSend._manualEmails)window._mkCampSend._manualEmails=[];
  if(window._mkCampSend._manualEmails.indexOf(email)!==-1){toast('Email déjà ajouté','info');return;}
  window._mkCampSend._manualEmails.push(email);
  inp.value='';
  mkCampaignComposeModal();
};
window.mkRemoveManualEmail=function(idx){if(window._mkCampSend._manualEmails){window._mkCampSend._manualEmails.splice(idx,1);mkCampaignComposeModal();}};
window.mkSaveCurrentSelectionAsGroup=function(){
  var sel=window._mkCampSend._selTags||[];
  if(!sel.length){toast('Sélectionne au moins un tag','err');return;}
  var name=prompt('Nom du groupe :',sel.slice(0,3).join(', ')+(sel.length>3?' +'+(sel.length-3):''));
  if(!name)return;
  mkSaveGroup(name,sel);
  mkCampaignComposeModal();
};

/* --- Save draft --- */
window.mkSaveDraftFromCompose=function(){
  var send=window._mkCampSend;
  var subject=send.item.subject||document.getElementById('mkeSubject')?.value||'';
  var body=mkGetQuillHTML();
  if(!subject&&!body){toast('Renseigne au moins un objet ou un corps','err');return;}
  MK.emails.push({name:'[Brouillon] '+subject,subject:subject,body:body,status:'draft',createdAt:new Date().toISOString()});
  svMk();clsM();toast('Brouillon sauvegardé','ok');rMarketing();
};

/* --- Enhanced Gmail Send --- */
window.mkExecuteEnhancedSend=async function(){
  var send=window._mkCampSend;
  if(!send)return;
  if(!gcalHasValidToken()){toast('Connecte ton compte Google d\'abord','err');return;}
  var selTags=send._selTags||[];
  var contacts=mkContactsByTag(selTags).filter(function(c){return c.email});
  var manualEmails=send._manualEmails||[];
  var manualContacts=manualEmails.map(function(e){return{id:'manual',email:e,firstName:'',lastName:'',company:'',title:'',_fkey:'manual',_folder:'Manual'};});
  var allContacts=contacts.concat(manualContacts);
  if(!allContacts.length&&!send._testMode){toast('Aucun contact avec email','err');return;}
  var subject=send.item.subject||document.getElementById('mkeSubject')?.value||'';
  var campSel=document.getElementById('mkeCampaign');if(campSel)send.item.campaignName=campSel.value||'';
  var campaignName=send.item.campaignName||send.item.name||subject;
  var bodyTemplate=mkGetQuillHTML();
  var signature=window.MK_SIGNATURE||'';
  var recipients=[];
  if(send._testMode){
    try{var prof=await gcalGetProfile();recipients=[{email:prof.emailAddress||prof.email||'',firstName:'Moi',lastName:''}];}catch(e){toast('Impossible de récupérer ton email','err');return;}
  }else{recipients=allContacts;}
  if(!send._testMode&&!subject){toast('Ajoute un objet','err');return;}
  if(!send._testMode&&!bodyTemplate){toast('Écris un message','err');return;}
  toast('Envoi en cours...','info');
  var sent=0;var errors=0;
  var encodedSubject=typeof gmailEncodeSubject==='function'?gmailEncodeSubject(subject):'=?UTF-8?B?'+btoa(unescape(encodeURIComponent(subject)))+'?=';
  var dateStr=new Date().toUTCString();
  if(send._bccMode&&!send._testMode){
    try{
      var bccList=recipients.map(function(r){return r.email}).join(', ');
      var _bLogId=Date.now();
      var _trackPixel='<img src="https://tracking.crm.local/px.gif?eid='+_bLogId+'" width="1" height="1" style="display:none" alt="">';
      var bccBody=bodyTemplate.replace(/\{\{signature\}\}/g,signature)+_trackPixel;
      var mimeLines=['To: undisclosed-recipients:;','Bcc: '+bccList,'Subject: '+encodedSubject,'Date: '+dateStr,'Content-Type: text/html; charset=UTF-8','MIME-Version: 1.0','',''];
      var rawBody=mimeLines.join('\r\n')+bccBody;

/* --- Check email replies & bounces --- */
window.checkEmailReplies=async function(){
  if(!gcalHasValidToken()||!window.MK_ELOG||!window.MK_ELOG.length)return;
  try{
    var unresolved=window.MK_ELOG.filter(function(e){return !e.bounced&&!e.replied;});
    if(!unresolved.length)return;
    var since=unresolved.reduce(function(min,e){return Math.min(min,new Date(e.date).getTime())},Date.now()-14*86400000);
    var sinceDate=new Date(since).toISOString().split('T')[0];
    var q='after:'+sinceDate+' (in:inbox OR in:sent)';
    var r=await fetch('https://gmail.googleapis.com/gmail/v1/users/me/messages?q='+encodeURIComponent(q)+'&maxResults=30',{headers:{Authorization:'Bearer '+GCAL.token}});
    if(!r.ok)return;
    var data=await r.json();
    if(!data.messages)return;
    var updated=false;
    var elogByEmail={};
    window.MK_ELOG.forEach(function(e){if(!elogByEmail[e.to])elogByEmail[e.to]=[];elogByEmail[e.to].push(e);});
    for(var i=0;i<data.messages.length&&i<20;i++){
      var msgId=data.messages[i].id;
      var mr=await fetch('https://gmail.googleapis.com/gmail/v1/users/me/messages/'+msgId+'?format=metadata&metadataHeaders=From&metadataHeaders=Subject&metadataHeaders=References&metadataHeaders=In-Reply-To&metadataHeaders=X-Failed-Recipients',{headers:{Authorization:'Bearer '+GCAL.token}});
      if(!mr.ok)continue;
      var msg=await mr.json();
      var headers=(msg.payload&&msg.payload.headers)||[];
      var getH=function(name){var h=headers.find(function(hh){return hh.name===name;});return h?h.value:'';};
      var fromVal=getH('From');
      var fromEmail=fromVal.replace(/.*<(.+?)>.*/,function(m,e){return e;}).trim().toLowerCase();
      var subject=getH('Subject')||'';
      var refs=getH('References')||'';
      var inReplyTo=getH('In-Reply-To')||'';
      var failedRecip=getH('X-Failed-Recipients')||'';
      var isBounce=failedRecip||(/mailer-daemon|delivery.*fail|undeliver|non-remis|impossible.*livrer/i.test(fromVal+' '+subject));
      if(isBounce&&failedRecip){
        var bouncedEmail=failedRecip.trim().toLowerCase();
        var bouncedEntry=window.MK_ELOG.find(function(e){return e.to.toLowerCase()===bouncedEmail&&!e.bounced&&!e.replied;});
        if(!bouncedEntry){
          var candidates=elogByEmail[bouncedEmail];
          if(candidates)bouncedEntry=candidates.find(function(e){return !e.bounced&&!e.replied;});
        }
        if(bouncedEntry){bouncedEntry.bounced=true;bouncedEntry.bounceDate=new Date().toISOString();bouncedEntry.status='bounced';updated=true;}
        continue;
      }
      if(!fromEmail||fromEmail.indexOf('@')===-1)continue;
      var replyMatch=null;
      /* Matching priorité 1 : threadId Gmail (le plus fiable) */
      if(!replyMatch&&msg.threadId){
        replyMatch=window.MK_ELOG.find(function(e){return e.threadId&&e.threadId===msg.threadId&&!e.replied&&!e.bounced;});
      }
      /* Matching priorité 2 : headers References / In-Reply-To */
      if(!replyMatch&&(refs||inReplyTo)){
        var refIds=(refs+' '+inReplyTo).split(/\s+/).filter(Boolean);
        for(var j=0;j<refIds.length&&!replyMatch;j++){
          replyMatch=window.MK_ELOG.find(function(e){return e.gmailMessageId&&e.gmailMessageId===refIds[j]&&!e.replied&&!e.bounced;});
        }
      }
      if(!replyMatch&&/^(\s*(re|fwd?|tr|re\u0300?)\s*[:\u00a0\u200f]\s*)/i.test(subject)){
        var candidates=elogByEmail[fromEmail];
        if(candidates)replyMatch=candidates.find(function(e){return !e.replied&&!e.bounced&&(e.subject&&subject.toLowerCase().indexOf(e.subject.toLowerCase().replace(/^(\s*(re|fwd?|tr|re\u0300?)\s*[:\u00a0\u200f]\s*)/i,''))!==-1);});
      }
      if(replyMatch){replyMatch.replyDate=new Date(msg.internalDate?Number(msg.internalDate):Date.now()).toISOString();replyMatch.replied=true;updated=true;}
    }
    if(updated){svElog();if(S.v==='marketing'&&S.mkv==='emails')rMarketing();}
  }catch(e){console.error('checkEmailReplies:',e);}
};

    if(!e.bounced)h+='<button onclick="mkToggleElogReplied('+e.id+')" class="w-7 h-7 rounded-lg flex items-center justify-center '+(e.replied?'text-inf bg-infS':'text-mut hover:text-inf hover:bg-infS/50')+' bp" data-tip="Marquer répondu"><i class="fa-solid fa-reply text-[.5rem]"></i></button>';
    h+='<button onclick="mkToggleElogBounced('+e.id+')" class="w-7 h-7 rounded-lg flex items-center justify-center '+(e.bounced?'text-warn bg-warnS':'text-mut hover:text-warn hover:bg-warnS/50')+' bp" data-tip="Marquer rebond"><i class="fa-solid fa-circle-exclamation text-[.5rem]"></i></button>';
    h+='<button onclick="mkDeleteElogEntry('+e.id+')" class="w-7 h-7 rounded-lg flex items-center justify-center text-mut hover:text-red-400 hover:bg-red-400/10 bp" data-tip="Supprimer"><i class="fa-solid fa-trash text-[.5rem]"></i></button>';
    h+='</div></div>';
  }
  if(filtered.length>maxShow){
    h+='<div class="text-center py-3 border-t border-bdr/50 text-[.65rem] text-mut">Affichage de '+maxShow+' sur '+filtered.length+' résultats</div>';
  }
  h+='</div>';
}
return h;
}

/* ===== EMAIL AUTOMATION SEQUENCES ===== */

/* --- Data Layer --- */
function ldSeqs(){try{var s=localStorage.getItem('cdc_email_seqs');if(s)return JSON.parse(s);}catch(e){}return[];}
function svSeqs(){localStorage.setItem('cdc_email_seqs',JSON.stringify(window.MK_SEQUENCES));}
window.MK_SEQUENCES=ldSeqs();
function ldSeqRuns(){try{var s=localStorage.getItem('cdc_email_seq_runs');if(s)return JSON.parse(s);}catch(e){}return[];}
function svSeqRuns(){localStorage.setItem('cdc_email_seq_runs',JSON.stringify(window.MK_SEQ_RUNS));}
window.MK_SEQ_RUNS=ldSeqRuns();

/* --- Sequence CRUD --- */
window.mkNewSeqId=function(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);};
window.mkSaveSequence=function(seq){
  if(!seq.name||!seq.name.trim()){toast('Nom requis','err');return false;}
  seq.name=seq.name.trim();seq.updatedAt=new Date().toISOString();
  var idx=window.MK_SEQUENCES.findIndex(function(s){return s.id===seq.id;});
  if(idx>=0){window.MK_SEQUENCES[idx]=seq;}
  else{seq.id=seq.id||mkNewSeqId();seq.createdAt=new Date().toISOString();window.MK_SEQUENCES.push(seq);}
  svSeqs();return true;
};
window.mkDeleteSequence=function(id){
  window.MK_SEQUENCES=window.MK_SEQUENCES.filter(function(s){return s.id!==id;});
  window.MK_SEQ_RUNS=window.MK_SEQ_RUNS.filter(function(r){return r.sequenceId!==id;});
  svSeqs();svSeqRuns();toast('Séquence supprimée','info');if(S.mkv==='emails')rMarketing();
};
window.mkToggleSeqEnabled=function(id){
  var seq=window.MK_SEQUENCES.find(function(s){return s.id===id;});
  if(seq){seq.enabled=!seq.enabled;svSeqs();if(S.mkv==='emails')rMarketing();}
};
window.mkDuplicateSequence=function(id){
  var src=window.MK_SEQUENCES.find(function(s){return s.id===id;});if(!src)return;
  var copy=JSON.parse(JSON.stringify(src));
  copy.id=mkNewSeqId();copy.name=src.name+' (copie)';
  copy.createdAt=new Date().toISOString();copy.updatedAt=copy.createdAt;copy.enabled=false;
  window.MK_SEQUENCES.push(copy);svSeqs();toast('Séquence dupliquée','ok');if(S.mkv==='emails')rMarketing();
};

    seq={id:'',name:'',description:'',enabled:true,steps:[
      {delay:0,subject:'',body:'<p>Bonjour {{prenom}},</p><p>Votre message ici...</p><p>Cordialement,<br>{{signature}}</p>',stopIfReplied:true}

      if(si>0)h+='<button onclick="mkSeqMoveStep('+si+',-1)" class="w-6 h-6 rounded text-mut hover:text-txt bp"><i class="fa-solid fa-chevron-up text-[.5rem]"></i></button>';

    }
    h+='<button onclick="mkSeqDeleteStep('+si+')" class="w-6 h-6 rounded text-mut hover:text-red-400 bp"><i class="fa-solid fa-trash text-[.5rem]"></i></button>';
    h+='</div></div>';
    if(si>0){
      h+='<div class="mb-3"><label class="text-[.6rem] text-mut block mb-1">Délai après l\'étape précédente</label>';
      h+='<div class="flex items-center gap-2"><input type="number" id="mkSeqDelay_'+si+'" class="fi text-xs w-20" min="1" max="90" value="'+step.delay+'" onchange="window._mkSeqEdit.steps['+si+'].delay=parseInt(this.value)||1">';
      h+='<span class="text-[.6rem] text-mut">jour(s)</span></div></div>';
    }
    h+='<div class="mb-3"><label class="text-[.6rem] text-mut block mb-1">Objet</label>';

    h+='<div class="mb-3"><label class="text-[.6rem] text-mut block mb-1">Corps du message</label>';
    h+='<textarea id="mkSeqBody_'+si+'" class="fi text-xs" rows="4" placeholder="Bonjour {{prenom}}..." oninput="window._mkSeqEdit.steps['+si+'].body=this.value">'+escHtml(step.body||'')+'</textarea></div>';
    h+='<div class="text-[.55rem] text-mut mb-2">Variables : <code class="bg-sAlt px-1 rounded">{{prenom}}</code> <code class="bg-sAlt px-1 rounded">{{nom}}</code> <code class="bg-sAlt px-1 rounded">{{name}}</code> <code class="bg-sAlt px-1 rounded">{{entreprise}}</code> <code class="bg-sAlt px-1 rounded">{{poste}}</code></div>';
    h+='<label class="flex items-center gap-2 text-[.6rem] text-mut cursor-pointer select-none"><input type="checkbox" id="mkSeqStop_'+si+'" '+(step.stopIfReplied?'checked':'')+' onchange="window._mkSeqEdit.steps['+si+'].stopIfReplied=this.checked" class="w-3.5 h-3.5 accent-acc"><span>Arrêter si une réponse est reçue</span></label>';

  h+='</div></div>';
  opM(h);
};
window.mkSeqAddStep=function(){
  if(!window._mkSeqEdit)return;
  var lastDelay=window._mkSeqEdit.steps.length?Math.max(window._mkSeqEdit.steps[window._mkSeqEdit.steps.length-1].delay,3):3;
  window._mkSeqEdit.steps.push({delay:lastDelay,subject:'',body:'<p>Bonjour {{prenom}},</p><p>...</p><p>Cordialement,<br>{{signature}}</p>',stopIfReplied:true});
  mkSeqEditorModal(null,true);
};
window.mkSeqDeleteStep=function(si){
  if(!window._mkSeqEdit||window._mkSeqEdit.steps.length<=1)return;
  window._mkSeqEdit.steps.splice(si,1);mkSeqEditorModal(null,true);
};
window.mkSeqMoveStep=function(si,dir){
  if(!window._mkSeqEdit)return;
  var nsi=si+dir;if(nsi<0||nsi>=window._mkSeqEdit.steps.length)return;
  var tmp=window._mkSeqEdit.steps[si];window._mkSeqEdit.steps[si]=window._mkSeqEdit.steps[nsi];window._mkSeqEdit.steps[nsi]=tmp;
  mkSeqEditorModal(null,true);
};
window.mkSeqSaveFromModal=function(existingId){
  var seq=window._mkSeqEdit;if(!seq)return;
  seq.name=(document.getElementById('mkSeqName')||{}).value||'';
  seq.description=(document.getElementById('mkSeqDesc')||{}).value||'';
  seq.steps.forEach(function(step,si){
    if(si>0)step.delay=parseInt((document.getElementById('mkSeqDelay_'+si)||{}).value)||3;
    step.subject=(document.getElementById('mkSeqSubject_'+si)||{}).value||'';
    step.body=(document.getElementById('mkSeqBody_'+si)||{}).value||'';
    step.stopIfReplied=(document.getElementById('mkSeqStop_'+si)||{}).checked!==false;
  });
  if(!seq.name.trim()){toast('Nom requis','err');return;}
  if(!seq.steps.some(function(s){return s.subject||s.body;})){toast('Ajoute au moins le contenu d\'une étape','err');return;}
  if(mkSaveSequence(seq)){clsM();toast('Séquence enregistrée','ok');if(S.mkv==='emails')rMarketing();}
};

/* --- Execute Sequence Launch --- */
window.mkSeqExecuteLaunch=async function(seqId){
  var seq=window.MK_SEQUENCES.find(function(s){return s.id===seqId;});if(!seq)return;
  var contacts=mkContactsByTag(window._mkSeqLaunch._selTags).filter(function(c){return c.email;});
  if(!contacts.length){toast('Aucun contact','err');return;}
  if(!gcalHasValidToken()){toast('Connecte ton compte Google','err');return;}
  var activeEmails=new Set(window.MK_SEQ_RUNS.filter(function(r){return r.sequenceId===seqId&&r.status==='active';}).map(function(r){return r.contactEmail.toLowerCase();}));
  var newContacts=contacts.filter(function(c){return !activeEmails.has(c.email.toLowerCase());});
  if(!newContacts.length){toast('Tous les contacts sont déjà dans cette séquence','info');return;}
  toast('Lancement pour '+newContacts.length+' contact(s)...','info');clsM();
  var signature=window.MK_SIGNATURE||'';var launched=0;var errors=0;
  for(var i=0;i<newContacts.length;i++){
    try{
      var c=newContacts[i];var step=seq.steps[0];
      var personalized=mkPersonalizeBody(step.body.replace(/\{\{signature\}\}/g,signature),c);
      var encodedSubject=typeof gmailEncodeSubject==='function'?gmailEncodeSubject(step.subject):'=?UTF-8?B?'+btoa(unescape(encodeURIComponent(step.subject)))+'?=';
      var dateStr=new Date().toUTCString();
      var mimeLines=['To: '+c.email,'Subject: '+encodedSubject,'Date: '+dateStr,'Content-Type: text/html; charset=UTF-8','MIME-Version: 1.0','',''];
      var rawBody=mimeLines.join('\r\n')+personalized;
      var encoded=btoa(unescape(encodeURIComponent(rawBody))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
      var r=await fetch('https://gmail.googleapis.com/gmail/v1/users/me/messages/send',{method:'POST',headers:{Authorization:'Bearer '+GCAL.token,'Content-Type':'application/json'},body:JSON.stringify({raw:encoded})});
      if(r.ok){
        var sentData=await r.json();var gMsgId=sentData&&sentData.id?sentData.id:'';var gThreadId=sentData&&sentData.threadId?sentData.threadId:'';
        var runId=Date.now().toString(36)+Math.random().toString(36).slice(2,5);
        window.MK_ELOG.push({id:Date.now()+i,to:c.email,subject:step.subject,status:'sent',date:new Date().toISOString(),contactName:contactDisplayName(c),gmailMessageId:gMsgId,threadId:gThreadId,mode:'sequence',campaignName:'Séquence: '+seq.name,sequenceId:seqId,sequenceRunId:runId});
        var nextStepAt=null;
        if(seq.steps.length>1){var nd=seq.steps[1].delay||3;nextStepAt=new Date(Date.now()+nd*86400000).toISOString();}
        window.MK_SEQ_RUNS.push({id:runId,sequenceId:seqId,sequenceName:seq.name,contactEmail:c.email,contactName:contactDisplayName(c),currentStep:seq.steps.length>1?1:-1,status:seq.steps.length>1?'active':'completed',startedAt:new Date().toISOString(),nextStepAt:nextStepAt,stepLog:[{stepIndex:0,sentAt:new Date().toISOString(),gmailMessageId:gMsgId,status:'sent'}]});
        launched++;
      }else{errors++;try{var ed=await r.json();console.error('[seqLaunch]',ed);if(i===0)toast('Erreur: '+(ed.error&&ed.error.message?ed.error.message:'HTTP '+r.status),'err');}catch(ex){if(i===0)toast('Erreur HTTP '+r.status,'err');}}
    }catch(e){errors++;console.error('[seqLaunch]',e);if(i===0)toast('Erreur: '+e.message,'err');}
    if(i<newContacts.length-1)await new Promise(function(res){setTimeout(res,200);});
  }
  svElog();svSeqRuns();if(S.mkv==='emails')rMarketing();
  toast(launched+' séquence(s) lancée(s)'+(errors?' ('+errors+' échec'+(errors>1?'s':'')+')':''),'ok');
};

/* --- Sequence Scheduler (runs every 60s) --- */
window.mkSeqScheduler=async function(){
  if(!gcalHasValidToken())return;
  var now=Date.now();
  var due=window.MK_SEQ_RUNS.filter(function(r){return r.status==='active'&&r.nextStepAt&&new Date(r.nextStepAt).getTime()<=now;});
  if(!due.length)return;
  var seqCache={};var signature=window.MK_SIGNATURE||'';var didSomething=false;
  for(var i=0;i<due.length;i++){
    var run=due[i];
    var seq=seqCache[run.sequenceId];
    if(!seq){seq=window.MK_SEQUENCES.find(function(s){return s.id===run.sequenceId;});seqCache[run.sequenceId]=seq;}
    if(!seq||!seq.steps||run.currentStep>=seq.steps.length){run.status='completed';run.nextStepAt=null;svSeqRuns();didSomething=true;continue;}
    if(!seq.enabled){run.status='paused';svSeqRuns();didSomething=true;continue;}
    var step=seq.steps[run.currentStep];
    if(step.stopIfReplied){
      var wasReplied=window.MK_ELOG.some(function(e){return e.sequenceRunId===run.id&&e.replied;});
      if(wasReplied){run.status='completed';run.nextStepAt=null;svSeqRuns();console.log('[seqScheduler] '+run.contactEmail+' : arrêt (réponse)');didSomething=true;continue;}
    }
    try{
      var personalized=mkPersonalizeBody(step.body.replace(/\{\{signature\}\}/g,signature),{email:run.contactEmail,firstName:'',lastName:'',company:'',title:''});
      var encodedSubject=typeof gmailEncodeSubject==='function'?gmailEncodeSubject(step.subject):'=?UTF-8?B?'+btoa(unescape(encodeURIComponent(step.subject)))+'?=';
      var dateStr=new Date().toUTCString();
      var mimeLines=['To: '+run.contactEmail,'Subject: '+encodedSubject,'Date: '+dateStr,'Content-Type: text/html; charset=UTF-8','MIME-Version: 1.0','',''];
      var rawBody=mimeLines.join('\r\n')+personalized;
      var encoded=btoa(unescape(encodeURIComponent(rawBody))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
      var r=await fetch('https://gmail.googleapis.com/gmail/v1/users/me/messages/send',{method:'POST',headers:{Authorization:'Bearer '+GCAL.token,'Content-Type':'application/json'},body:JSON.stringify({raw:encoded})});
      if(r.ok){
        var sentData=await r.json();var gMsgId=sentData&&sentData.id?sentData.id:'';var gThreadId=sentData&&sentData.threadId?sentData.threadId:'';
        window.MK_ELOG.push({id:Date.now(),to:run.contactEmail,subject:step.subject,status:'sent',date:new Date().toISOString(),contactName:run.contactName,gmailMessageId:gMsgId,threadId:gThreadId,mode:'sequence',campaignName:'Séquence: '+run.sequenceName,sequenceId:run.sequenceId,sequenceRunId:run.id});
        run.stepLog.push({stepIndex:run.currentStep,sentAt:new Date().toISOString(),gmailMessageId:gMsgId,threadId:gThreadId,status:'sent'});
        run.currentStep++;
        if(run.currentStep>=seq.steps.length){run.status='completed';run.nextStepAt=null;}
        else{var nd=seq.steps[run.currentStep].delay||3;run.nextStepAt=new Date(Date.now()+nd*86400000).toISOString();}
        svElog();svSeqRuns();didSomething=true;
        console.log('[seqScheduler] Étape envoyée à '+run.contactEmail);
      }else{console.error('[seqScheduler] Erreur pour '+run.contactEmail,r.status);}
    }catch(e){console.error('[seqScheduler] Exception pour '+run.contactEmail,e);}
  }
  if(didSomething&&S.mkv==='emails')rMarketing();
};
setInterval(function(){mkSeqScheduler();},60000);

  if(digits.charAt(0)==='0'&&digits.length===10)digits=window.ldWaDefaultCC()+digits.substr(1); /* numéro local -> ajoute l'indicatif */

window.mkWaSaveCamp=function(existingId){
  var ed=window._mkWaEdit;if(!ed)return;
  ed.name=(document.getElementById('waCampName')||{}).value||'';
  ed.message=(document.getElementById('waCampMsg')||{}).value||'';
  ed.status=(document.getElementById('waCampStatus')||{}).value||'draft';
  if(!ed.name.trim()){toast('Nom requis','err');return;}
  if(!ed.message.trim()){toast('Message requis','err');return;}
  ed.updatedAt=new Date().toISOString();
  var idx=-1;if(existingId){idx=window.MK_WA_CAMPAIGNS.findIndex(function(c){return c.id===existingId;});}
  if(idx>=0){window.MK_WA_CAMPAIGNS[idx]=ed;}else{window.MK_WA_CAMPAIGNS.push(ed);}
  svWaCampaigns();clsM();toast('Campagne enregistrée','ok');rMarketing();
};

window.mkWaDeleteCamp=function(campId){
  if(!confirm('Supprimer cette campagne ?'))return;
  window.MK_WA_CAMPAIGNS=window.MK_WA_CAMPAIGNS.filter(function(c){return c.id!==campId;});
  window.MK_WA_LOG=window.MK_WA_LOG.filter(function(e){return e.campaignId!==campId;});
  svWaCampaigns();svWaLog();toast('Campagne supprimée','info');rMarketing();
};

window.mkWaExecuteSend=function(){

  var camp=window.MK_WA_CAMPAIGNS.find(function(c){return c.id===send.campId;});
  if(!camp){toast('Campagne introuvable','err');return;}
  var contacts=mkContactsByTag(send._selTags).filter(function(c){return c.phone||c.mobile;});
  var manualPhones=send._manualPhones||[];
  var allRecipients=[];
  contacts.forEach(function(c){
    var phone=window.waFormatPhone(c.phone||c.mobile||'');
    if(phone.length>=8)allRecipients.push({phone:phone,name:contactDisplayName(c),firstName:c.firstName||'',lastName:c.lastName||'',company:c.company||'',title:c.title||''});
  });

    var waUrl='https://wa.me/'+r.phone+'?text='+personalized;
    if(i===0){window.open(waUrl,'_blank');}
  });

window.mkSaveMeetingFromModal=async function(existingId){
  var me=window._mkMeetEdit;if(!me)return;
  me.title=(document.getElementById('mkTitle')||{}).value||'';
  me.date=(document.getElementById('mkDate')||{}).value||localDateStr(new Date());
  me.startTime=(document.getElementById('mkStart')||{}).value||'09:00';
  me.endTime=(document.getElementById('mkEnd')||{}).value||'10:00';
  me.location=(document.getElementById('mkLocation')||{}).value||'';
  me.conferenceLink=(document.getElementById('mkConfLink')||{}).value||'';
  me.notes=(document.getElementById('mkNotes')||{}).value||'';
  var campEl=document.getElementById('mkCampaign');if(campEl)me.campaignName=campEl.value||'';
  var syncGCal=(document.getElementById('mkSyncGCal')||{}).checked;
  if(!me.title){toast('Titre requis','err');return;}
  var sTime=me.startTime?me.startTime.split(':'):['9','0'];var eTime=me.endTime?me.endTime.split(':'):['10','0'];
  me.duration=Math.max(1,Math.round((parseInt(eTime[0])*60+parseInt(eTime[1])-parseInt(sTime[0])*60-parseInt(sTime[1]))));
  me.updatedAt=new Date().toISOString();
  var idx=-1;if(existingId){idx=window.MK_MEETINGS.findIndex(function(x){return x.id===existingId;});}
  if(idx>=0){
    var old=window.MK_MEETINGS[idx];
    Object.assign(old,me);old.id=existingId;
    if(syncGCal&&gcalHasValidToken()){await mkSyncMeetingToGCal(existingId);}
  }else{
    me.id=Date.now();me.createdAt=me.updatedAt;
    window.MK_MEETINGS.push(me);
    if(syncGCal&&gcalHasValidToken()){await mkSyncMeetingToGCal(me.id);}
  }
  svMeetings();clsM();
  toast(existingId?'Meeting mis à jour':'Meeting créé','ok');
  if(S.v==='meetings')rMeetings();
};

window.mkSyncMeetingToGCal=async function(id){
  var m=window.MK_MEETINGS.find(function(x){return x.id===id;});if(!m)return;
  if(!gcalHasValidToken()){toast('Connecte ton compte Google Agenda d\'abord','err');return;}
  if(!m.date||!m.startTime){toast('Date et heure requises','err');return;}
  var startDt=new Date(m.date+'T'+m.startTime+':00');
  var endDt=m.endTime?new Date(m.date+'T'+m.endTime+':00'):new Date(startDt.getTime()+(m.duration||30)*60000);
  var body={
    summary:m.title,
    description:'Meeting avec '+(m.contactName||m.contactEmail||'')+(m.notes?'\n\n'+m.notes:''),
    start:{dateTime:startDt.toISOString()},
    end:{dateTime:endDt.toISOString()}
  };
  if(m.location)body.location=m.location;
  if(m.conferenceLink)body.description+='\nVisio : '+m.conferenceLink;
  if(m.contactEmail)body.attendees=[{email:m.contactEmail}];
  try{
    var url='https://www.googleapis.com/calendar/v3/calendars/primary/events';
    var method='POST';
    if(m.gcalEventId){url+='/'+m.gcalEventId;method='PATCH';}
    var r=await fetch(url,{method:method,headers:{Authorization:'Bearer '+GCAL.token,'Content-Type':'application/json'},body:JSON.stringify(body)});
    if(r.status===401){GCAL.connected=false;GCAL.token=null;toast('Session Google expirée','err');return;}
    if(!r.ok)throw new Error('HTTP '+r.status);
    var ev=await r.json();
    m.gcalEventId=ev.id;m.updatedAt=new Date().toISOString();
    svMeetings();
    toast(m.gcalEventId?'Meeting synchronisé':'Meeting créé dans Google Agenda','ok');
    if(S.v==='meetings')rMeetings();
  }catch(e){toast('Erreur de synchronisation : '+e.message,'err');}
};

window.mkProposeMeetingSlots=function(id){
  var m=window.MK_MEETINGS.find(function(x){return x.id===id;});if(!m)return;
  var baseDate=new Date(m.date+'T00:00:00');
  var slots=[];var hours=['09:00','10:00','11:00','14:00','15:00','16:00'];
  for(var d=0;d<5;d++){
    var dd=new Date(baseDate.getTime()+d*86400000);
    if(dd.getDay()===0||dd.getDay()===6)continue;
    var ds=localDateStr(dd);
    for(var h=0;h<hours.length;h++){
      if(slots.length>=5)break;
      slots.push({date:ds,time:hours[h]});
    }
    if(slots.length>=5)break;
  }
  m.proposedSlots=slots;
  m.status='proposed';m.updatedAt=new Date().toISOString();
  svMeetings();toast(slots.length+' créneaux proposés','ok');
  mkMeetingModal(id);
};

window.mkGetAvailableSlots=function(dateStr){
  var bs=window.MK_BOOKING;if(!bs.enabled)return[];
  var slots=[];var d=new Date(dateStr+'T00:00:00');
  if(!bs.weekdays.includes(d.getDay()))return[];
  var now=new Date();
  var startH=parseInt(bs.startHour.split(':')[0]);var startM=parseInt(bs.startHour.split(':')[1]||'0');
  var endH=parseInt(bs.endHour.split(':')[0]);var endM=parseInt(bs.endHour.split(':')[1]||'0');
  var duration=bs.slotDuration||30;
  var lunchS=bs.lunchBreak?parseInt(bs.lunchStart.split(':')[0])*60+parseInt((bs.lunchStart.split(':')[1]||'0')):null;
  var lunchE=bs.lunchBreak?parseInt(bs.lunchEnd.split(':')[0])*60+parseInt((bs.lunchEnd.split(':')[1]||'0')):null;
  var minNoticeMs=(bs.minNoticeHours||0)*3600000;
  var busy=bs.busy||[]; /* créneaux occupés remontés de Google Agenda (freebusy) */
  var publicMeetings=window._mkPublicMeetings||[]; /* réservations existantes vues par un visiteur sans accès local */
  for(var mins=startH*60+startM;mins<endH*60+endM;mins+=duration){
    if(lunchS!==null&&mins+duration>lunchS&&mins<lunchE)continue;
    var hh=Math.floor(mins/60);var mm=mins%60;
    var slotTime=String(hh).padStart(2,'0')+':'+String(mm).padStart(2,'0');
    var slotEnd=String(Math.floor((mins+duration)/60)).padStart(2,'0')+':'+String((mins+duration)%60).padStart(2,'0');
    var slotDateTime=new Date(dateStr+'T'+slotTime+':00');
    if(slotDateTime.getTime()-now.getTime()<minNoticeMs)continue;
    var slotStartMs=slotDateTime.getTime();var slotEndMs=slotStartMs+duration*60000;
    var booked=window.MK_MEETINGS.some(function(m){return m.date===dateStr&&m.startTime===slotTime&&m.status!=='cancelled';});
    if(!booked)booked=publicMeetings.some(function(m){return m.date===dateStr&&m.startTime===slotTime;});
    var isBusyInGCal=!booked&&busy.some(function(b){
      var bStart=new Date(b.start).getTime(),bEnd=new Date(b.end).getTime();
      return slotStartMs<bEnd&&slotEndMs>bStart;
    });
    if(!booked&&!isBusyInGCal)slots.push({date:dateStr,time:slotTime,end:slotEnd});
  }
  return slots;
};

/* --- Synchronisation Google Agenda -> disponibilités du Meeting Scheduler ---
   Récupère les plages "occupé" (freebusy) du calendrier principal sur la fenêtre
   de réservation, pour ne plus proposer de créneaux qui sont en réalité pris
   dans Google Agenda. Le résultat est mis en cache dans MK_BOOKING.busy et
   publié dans Firestore (collection public_booking) pour que la page de
   réservation publique (ouverte par un contact, sans compte Google) en
   bénéficie aussi. */
window.mkSyncGCalBusy=async function(force){
  if(typeof gcalHasValidToken!=='function'||!gcalHasValidToken())return false;
  var bs=window.MK_BOOKING;if(!bs.enabled)return false;
  var last=bs._busySyncedAt||0;
  if(!force&&Date.now()-last<5*60000)return false; /* max 1 appel API toutes les 5 min */
  try{
    var timeMin=new Date().toISOString();
    var timeMax=new Date(Date.now()+(bs.maxDaysForward||14)*86400000).toISOString();
    var r=await fetch('https://www.googleapis.com/calendar/v3/freeBusy',{
      method:'POST',headers:{Authorization:'Bearer '+GCAL.token,'Content-Type':'application/json'},
      body:JSON.stringify({timeMin:timeMin,timeMax:timeMax,items:[{id:'primary'}]})
    });
    if(!r.ok)return false;
    var data=await r.json();
    var rawBusy=(data.calendars&&data.calendars.primary&&data.calendars.primary.busy)||[];
    bs.busy=rawBusy.map(function(b){return{start:b.start,end:b.end};});
    bs._busySyncedAt=Date.now();
    svBookingSettings();
    window.mkPushPublicBooking();
    return true;
  }catch(e){console.error('[mkSyncGCalBusy]',e);return false;}
};

/* --- Publie un instantané public (lisible sans authentification) des
   disponibilités, pour que la page de réservation fonctionne aussi sur
   l'appareil du contact qui n'a ni le token Google ni les données locales
   de Kay. NÉCESSITE une règle Firestore autorisant la LECTURE publique de
   la collection "public_booking" (écriture réservée au propriétaire connecté) --- */
window.mkPushPublicBooking=function(){
  if(!(typeof fbIsReady==='function'&&fbIsReady()))return;
  var bs=window.MK_BOOKING;
  if(!bs.enabled||!bs.bookingLink)return;
  try{
    FB.db.collection('public_booking').doc(bs.bookingLink).set({
      enabled:bs.enabled,slotDuration:bs.slotDuration,minNoticeHours:bs.minNoticeHours,maxDaysForward:bs.maxDaysForward,
      startHour:bs.startHour,endHour:bs.endHour,weekdays:bs.weekdays,lunchBreak:bs.lunchBreak,lunchStart:bs.lunchStart,lunchEnd:bs.lunchEnd,
      location:bs.location,conferenceLink:bs.conferenceLink,instructions:bs.instructions,
      busy:bs.busy||[],
      meetings:(window.MK_MEETINGS||[]).filter(function(m){return m.status!=='cancelled';}).map(function(m){return{date:m.date,startTime:m.startTime};}),
      _ts:Date.now()
    }).catch(function(e){console.error('[mkPushPublicBooking]',e);});
  }catch(e){}
};

/* --- Public Booking Page (rendered when #booking=xxx in URL) ---
   Un visiteur (contact) qui ouvre ce lien n'a ni le token Google de Kay,
   ni ses données locales (localStorage est propre à chaque navigateur/appareil).
   On tente donc de récupérer un instantané public (settings + créneaux occupés
   + réservations existantes) depuis Firestore AVANT d'afficher les créneaux,
   pour que la page fonctionne correctement même sur l'appareil du contact. */
window.mkRenderBookingPage=function(linkId){
  /* Masquer toute l'interface CRM pour les visiteurs */
  var sidebar=document.getElementById('sb');if(sidebar)sidebar.style.display='none';
  var header=document.querySelector('header');if(header)header.style.display='none';
  var voiceBtn=document.getElementById('voiceBtn');if(voiceBtn)voiceBtn.style.display='none';
  var voiceOverlay=document.getElementById('voiceOverlay');if(voiceOverlay)voiceOverlay.style.display='none';
  var mobl=document.getElementById('mobl');if(mobl)mobl.style.display='none';
  document.body.style.overflow='auto';
  document.title='Reservation de creneau';
  var el=document.getElementById('PC');if(!el)return;
  el.innerHTML='<div class="af"><div class="text-center py-20 text-mut"><i class="fa-solid fa-circle-notch fa-spin text-2xl mb-3 block opacity-50"></i>Chargement des disponibilités...</div></div>';
  window.mkBkFetchPublicData(linkId).then(function(){window.mkBkRenderBookingPageInner(linkId);});
};

window.mkBkFetchPublicData=function(linkId){
  return new Promise(function(resolve){
    if(typeof FB==='undefined'||!FB.db){resolve();return;}
    FB.db.collection('public_booking').doc(linkId).get().then(function(snap){
      if(snap.exists){
        var d=snap.data();
        var localMatches=window.MK_BOOKING.bookingLink===linkId&&window.MK_BOOKING.enabled;
        if(!localMatches){
          /* Appareil du contact : aucune donnée locale, on utilise l'instantané public */
          window.MK_BOOKING=Object.assign({},window.MK_BOOKING,d,{bookingLink:linkId});
        }else{
          /* Appareil de Kay lui-même : on garde ses réglages locaux mais on
             rafraîchit les créneaux occupés au cas où un autre appareil aurait
             une version plus récente. */
          window.MK_BOOKING.busy=d.busy||window.MK_BOOKING.busy;
        }
        window._mkPublicMeetings=d.meetings||[];
      }
    }).catch(function(e){console.error('[mkBkFetchPublicData]',e);}).then(resolve);
  });
};

window.mkBkNavWeek=function(dir){

window.mkBkRenderWeek=function(){
  var offset=window._mkBkWeekOffset||0;
  var base=new Date();base.setDate(base.getDate()+offset*7);
  var start=new Date(base);start.setDate(base.getDate()-base.getDay()+1);
  var cards='';
  var monthLabel=start.toLocaleDateString('fr-CH',{month:'long',year:'numeric'});
  for(var d=0;d<7;d++){
    var dd=new Date(start.getTime()+d*86400000);
    var ds=localDateStr(dd);
    var isPast=ds<window._mkBkMinDate;
    var isFar=ds>window._mkBkMaxDate;
    var isSel=ds===window._mkBkSelectedDate;
    var hasSlots=!isPast&&!isFar&&window.MK_BOOKING.weekdays.includes(dd.getDay());
    var cls=isSel?'bg-acc text-black border-acc':'bg-surface border-bdr text-txt hover:border-acc/40';
    if(isPast||isFar||!hasSlots)cls+=' opacity-40 pointer-events-none';
    cards+='<button onclick="mkBkSelectDay(\''+ds+'\')" class="rounded-xl border p-3 text-center transition-all bp '+cls+'">';
    cards+='<div class="text-[.55rem] text-mut uppercase">'+dd.toLocaleDateString('fr-CH',{weekday:'short'})+'</div>';
    cards+='<div class="text-lg font-disp font-bold">'+dd.getDate()+'</div>';
    cards+='</button>';
  }
  document.getElementById('bkDayCards').innerHTML=cards;
  document.getElementById('bkWeekLabel').textContent=monthLabel.charAt(0).toUpperCase()+monthLabel.slice(1);
  if(window._mkBkSelectedDate)mkBkShowSlots(window._mkBkSelectedDate);
};

      mkBkShowConfirmation(meeting);
    });

window.mkSyncBookingToGCal=async function(meeting){
  var bs=window.MK_BOOKING;
  var body={summary:meeting.title,start:{dateTime:meeting.date+'T'+meeting.startTime+':00',timeZone:'Europe/Zurich'},end:{dateTime:meeting.date+'T'+meeting.endTime+':00',timeZone:'Europe/Zurich'}};
  if(meeting.location)body.location=meeting.location;
  if(meeting.conferenceLink)body.description='Visio : '+meeting.conferenceLink;
  if(meeting.contactEmail)body.attendees=[{email:meeting.contactEmail}];
  var r=await fetch('https://www.googleapis.com/calendar/v3/calendars/primary/events',{method:'POST',headers:{Authorization:'Bearer '+GCAL.token,'Content-Type':'application/json'},body:JSON.stringify(body)});
  if(r.ok){
    var ev=await r.json();
    var idx=window.MK_MEETINGS.findIndex(function(m){return m.id===meeting.id;});
    if(idx>=0){window.MK_MEETINGS[idx].gcalEventId=ev.id;svMeetings();}
  }
};

  var ids=['pipeFilterFolder','pipeFilterSource','pipeFilterCompany','pipeFilterTitle','pipeFilterRegion','pipeFilterCountry','pipeFilterStage','pipeFilterMonth','pipeFilterYear','pipeFilterTags','pipeFilterSearch'];

}

function pipeRenderCards(){
  var filterFolder=document.getElementById('pipeFilterFolder');
  var filterSource=document.getElementById('pipeFilterSource');
  var fFolder=filterFolder?filterFolder.value:'all';
  var fSource=filterSource?filterSource.value:'all';
  /* Advanced filters */
  var fCompany=(document.getElementById('pipeFilterCompany')||{}).value||'';
  var fTitle=(document.getElementById('pipeFilterTitle')||{}).value||'';
  var fRegion=(document.getElementById('pipeFilterRegion')||{}).value||'';
  var fCountry=(document.getElementById('pipeFilterCountry')||{}).value||'';
  var fStage=(document.getElementById('pipeFilterStage')||{}).value||'all';
  var fMonth=(document.getElementById('pipeFilterMonth')||{}).value||'all';
  var fYear=(document.getElementById('pipeFilterYear')||{}).value||'all';
  var fTags=(document.getElementById('pipeFilterTags')||{}).value||'';
  var fSearch=(document.getElementById('pipeFilterSearch')||{}).value||'';
  var fTagsArr=fTags?fTags.split(',').map(function(t){return t.trim().toLowerCase();}).filter(Boolean):[];
  var hasAdvFilters=fCompany||fTitle||fRegion||fCountry||fStage!=='all'||fMonth!=='all'||fYear!=='all'||fTagsArr.length||fSearch;

  /* Clear all columns */
  FUNNEL_STAGES.forEach(function(stg){
    var body=document.getElementById('pipeBody_'+stg.key);
    if(body)body.innerHTML='';
    var cnt=document.getElementById('pipeCnt_'+stg.key);
    if(cnt)cnt.textContent='0';
  });

  PIPELINE.forEach(function(entry){
    if(fFolder!=='all'&&entry.folderKey!==fFolder)return;
    if(fSource!=='all'&&entry.source!==fSource)return;
    /* Advanced filters */
    var contact=funnelGetContact(entry);
    if(fCompany){var cc=(contact&&contact.company||'').toLowerCase();if(cc.indexOf(fCompany.toLowerCase())===-1)return;}
    if(fTitle){var ct=(contact&&contact.title||'').toLowerCase();if(ct.indexOf(fTitle.toLowerCase())===-1)return;}
    if(fRegion){var cr=(contact&&contact.region||'').toLowerCase();if(cr.indexOf(fRegion.toLowerCase())===-1)return;}
    if(fCountry){var cco=(contact&&contact.country||'').toLowerCase();if(cco.indexOf(fCountry.toLowerCase())===-1)return;}
    if(fStage!=='all'&&entry.stage!==fStage)return;
    if(fMonth!=='all'||fYear!=='all'){
      var entryDate=entry.enteredAt?new Date(entry.enteredAt):null;
      if(!entryDate&&entry.history&&entry.history.length)entryDate=new Date(entry.history[0].from);
      if(entryDate){
        if(fMonth!=='all'&&entryDate.getMonth()!==parseInt(fMonth)-1)return;
        if(fYear!=='all'&&entryDate.getFullYear()!==parseInt(fYear))return;
      }else if(fMonth!=='all'||fYear!=='all')return;
    }
    if(fTagsArr.length){
      var eTags=(entry.tags||[]).map(function(t){return t.toLowerCase();});
      var cTags=(contact&&contact.tags||[]).map(function(t){return t.toLowerCase();});
      var allTags=eTags.concat(cTags);
      var hasTag=fTagsArr.some(function(ft){return allTags.indexOf(ft)!==-1;});
      if(!hasTag)return;
    }
    if(fSearch){
      var cName=contact?contactDisplayName(contact).toLowerCase():'';
      var sLow=fSearch.toLowerCase();
      var matchSearch=cName.indexOf(sLow)!==-1||(contact&&contact.email||'').toLowerCase().indexOf(sLow)!==-1||(contact&&contact.company||'').toLowerCase().indexOf(sLow)!==-1;
      if(!matchSearch)return;
    }
    var body=document.getElementById('pipeBody_'+entry.stage);
    if(!body)return;

    var contact=funnelGetContact(entry);
    var cName=contact?contactDisplayName(contact):'Contact #'+entry.contactId;
    var folder=FOLDERS.find(function(f){return f.key===entry.folderKey;});
    var fName=folder?folder.name:'?';
    var days=funnelDaysInStage(entry);
    var seqName='';
    if(entry.activeSequenceId){
      var seqs=window.MK_SEQUENCES||[];
      var seq=seqs.find(function(s){return s.id===entry.activeSequenceId;});
      seqName=seq?seq.name:'';
    }

    var card=document.createElement('div');
    card.className='pipe-card';
    card.draggable=true;
    card.setAttribute('data-entry-id',entry.id);
    card.setAttribute('data-contact-id',entry.contactId);
    card.setAttribute('data-folder-key',entry.folderKey);
    card.ondragstart=function(e){pipeDragStart(e,entry.id,entry.contactId,entry.folderKey);};
    card.ondragend=function(e){pipeDragEnd(e);};
    card.onclick=function(e){if(!e.target.closest('button'))pipeOpenDetail(entry.id);};
    card.innerHTML='<div class="pc-name">'+escHtml(cName)+'</div>'+
      '<div class="pc-folder">'+escHtml(fName)+'</div>'+
      '<div class="pc-meta"><span class="pc-value">'+(entry.estimatedValue?entry.estimatedValue.toLocaleString('fr-CH')+' CHF':'\u2014')+'</span><span class="pc-time">'+(days!==null?days+'j':'')+'</span></div>'+
      (seqName?'<div class="pc-seq"><i class="fa-solid fa-diagram-project"></i>'+escHtml(seqName)+'</div>':'');
    body.appendChild(card);

    var cnt=document.getElementById('pipeCnt_'+entry.stage);
    if(cnt)cnt.textContent=body.children.length;
  });
}

/* Drag & Drop handlers */
function pipeDragStart(e,entryId,contactId,folderKey){
  PIPE_DRAG={entryId:entryId,contactId:contactId,folderKey:folderKey};
  e.dataTransfer.effectAllowed='move';
  e.dataTransfer.setData('text/plain',entryId);
  e.target.classList.add('dragging');
}
function pipeDragEnd(e){
  e.target.classList.remove('dragging');
  document.querySelectorAll('.pipe-col').forEach(function(c){c.classList.remove('drop-target');});
}
function pipeDragOver(e){
  e.preventDefault();
  e.dataTransfer.dropEffect='move';
  var body=e.currentTarget.querySelector('.pipe-col-body');
  if(body)body.classList.add('drag-over');
}
function pipeDragLeave(e){
  var body=e.currentTarget.querySelector('.pipe-col-body');
  if(!body)return;
  if(!body.contains(e.relatedTarget)){
    body.classList.remove('drag-over');
    e.currentTarget.classList.remove('drop-target');
  }
}
function pipeDrop(e,newStage){
  e.preventDefault();
  var body=e.currentTarget.querySelector('.pipe-col-body');
  if(body)body.classList.remove('drag-over');
  e.currentTarget.classList.remove('drop-target');
  var entryId=e.dataTransfer.getData('text/plain')||PIPE_DRAG.entryId;
  if(!entryId)return;
  var entry=PIPELINE.find(function(f){return f.id===entryId;});
  if(!entry)return;
  var contact=funnelGetContact(entry);
  var cName=contact?contactDisplayName(contact):'?';
  var stgInfo=funnelStageInfo(newStage);
  /* Close detail panel if open for this entry */
  var overlay=document.getElementById('pipeDetailOverlay');
  if(overlay)overlay.remove();
  if(newStage==='lost'){
    pipeOpenLostReason(entryId,function(){
      toast(cName+' \u2192 '+stgInfo.label,'ok');
      rMarketingV2();
    });
    return;
  }
  if(funnelMoveTo(entryId,newStage)){
    toast(cName+' \u2192 '+stgInfo.label,'ok');
    rMarketingV2();
  }
}

/* Get candidate contacts matching selected tags (or all if no tags) */
function seq2GetLaunchCandidates(selTags){
  var all=[];
  FOLDERS.forEach(function(f){
    var contacts=(D[f.key]&&D[f.key].contacts)||[];
    contacts.forEach(function(c){
      if(selTags.length){
        var hasTag=selTags.some(function(t){return(c.tags||[]).indexOf(t)!==-1;});
        if(!hasTag)return;
      }
      if(c.email||c.phone){
        c.folderKey=f.key;
        all.push(c);
      }
    });
  });
  return all;
}

/* Count how many candidates are selected */
function seq2CountSelected(candidates,selIds){
  if(!selIds||!selIds.size)return 0;
  return candidates.filter(function(c){return selIds.has(c.folderKey+'|'+c.id);}).length;
}

/* Toggle individual contact */
window.seq2ToggleContact=function(key){
  if(!window._seq2Launch)return;
  if(window._seq2Launch._selIds.has(key)){window._seq2Launch._selIds.delete(key);}
  else{window._seq2Launch._selIds.add(key);}
  seq2LaunchModal(window._seq2Launch.seqId);
};

/* Select all visible candidates */
window.seq2SelectAll=function(){
  if(!window._seq2Launch)return;
  var selTags=window._seq2Launch._selTags;
  var candidates=seq2GetLaunchCandidates(selTags);
  window._seq2Launch._selIds=new Set(candidates.map(function(c){return c.folderKey+'|'+c.id;}));

};

/* --- WhatsApp dans les séquences : construit le message personnalisé et met
   l'envoi "en attente" (voir Marketing > WhatsApp) au lieu de faire semblant
   de l'avoir envoyé. Un clic utilisateur est indispensable pour ouvrir wa.me
   (sinon le navigateur bloque le popup silencieusement). --- */
window.seq2BuildWaMessage=function(step,c){
  var sig=window.MK_SIGNATURE||'';
  var msg=(step&&step.waMessage)||'';
  msg=msg.replace(/\{\{prenom\}\}/gi,(c&&c.firstName)||'')
    .replace(/\{\{nom\}\}/gi,(c&&c.lastName)||'')
    .replace(/\{\{name\}\}/gi,(typeof contactDisplayName==='function'&&c?contactDisplayName(c):''))
    .replace(/\{\{entreprise\}\}/gi,(c&&c.company)||'')
    .replace(/\{\{poste\}\}/gi,(c&&c.title)||'')
    .replace(/\{\{signature\}\}/gi,sig);
  return msg;
};
window.seq2QueueWaStep=function(run,step,c,stepIndex){
  var phone=window.waFormatPhone((c&&(c.phone||c.mobile))||'');
  var ok=!!phone&&phone.length>=8;
  var entry={id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),runId:run.id,sequenceId:run.sequenceId,sequenceName:run.sequenceName,contactName:(typeof contactDisplayName==='function'&&c?contactDisplayName(c):run.contactName)||'',phone:ok?phone:'',message:window.seq2BuildWaMessage(step,c||{}),stepIndex:stepIndex,status:'pending',createdAt:new Date().toISOString()};
  window.MK_WA_SEQ_PENDING.push(entry);
  window.svWaSeqPending();
  return ok;
};

window.seq2ExecuteLaunch=async function(seqId){
  var seq=SEQ2.find(function(s){return s.id===seqId;});if(!seq)return;
  /* Get only the manually selected contacts */
  var selIds=window._seq2Launch?window._seq2Launch._selIds:null;
  var candidates=seq2GetLaunchCandidates(window._seq2Launch?window._seq2Launch._selTags||[]:[]);
  var contacts=selIds&&selIds.size?candidates.filter(function(c){return selIds.has(c.folderKey+'|'+c.id);}):(selIds?[]:candidates);
  if(!contacts.length){toast('Aucun contact s\u00e9lectionn\u00e9','err');return;}
  var signature=window.MK_SIGNATURE||'';
  var launched=0,errors=0;
  toast('Lancement pour '+contacts.length+' contact(s)...','info');clsM();
  for(var i=0;i<contacts.length;i++){
    try{
      var c=contacts[i];var runId=seq2RunId();
      var run={
        id:runId,sequenceId:seqId,sequenceName:seq.name,
        contactId:c.id,contactEmail:c.email||'',contactName:contactDisplayName(c),
        folderKey:FOLDERS.find(function(f){return(D[f.key]&&D[f.key].contacts||[]).indexOf(c)!==-1;})||{key:'?'},
        currentStepId:null,currentStepIndex:0,
        status:'active',startedAt:new Date().toISOString(),
        nextStepAt:new Date().toISOString(),stepLog:[]
      };
      /* Execute first step */
      var step=seq.steps[0];var stepExecuted=false;
      if(step.type==='email'&&c.email&&gcalHasValidToken()){
        var personalized=mkPersonalizeBody((step.body||'').replace(/\{\{signature\}\}/g,signature),c);
        var encodedSubject=typeof gmailEncodeSubject==='function'?gmailEncodeSubject(step.subject||''):'=?UTF-8?B?'+btoa(unescape(encodeURIComponent(step.subject||'')))+'?=';
        var dateStr=new Date().toUTCString();
        var mimeLines=['To: '+c.email,'Subject: '+encodedSubject,'Date: '+dateStr,'Content-Type: text/html; charset=UTF-8','MIME-Version: 1.0','',''];
        var rawBody=mimeLines.join('\r\n')+personalized;
        var encoded=btoa(unescape(encodeURIComponent(rawBody))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
        var r=await fetch('https://gmail.googleapis.com/gmail/v1/users/me/messages/send',{method:'POST',headers:{Authorization:'Bearer '+GCAL.token,'Content-Type':'application/json'},body:JSON.stringify({raw:encoded})});
        if(r.ok){
          var sentData=await r.json();
          window.MK_ELOG.push({id:Date.now()+i,to:c.email,subject:step.subject,status:'sent',date:new Date().toISOString(),contactName:contactDisplayName(c),gmailMessageId:sentData&&sentData.id?sentData.id:'',threadId:sentData&&sentData.threadId?sentData.threadId:'',mode:'sequence',campaignName:'S\u00e9quence: '+seq.name,sequenceId:seqId,sequenceRunId:runId});
          run.stepLog.push({stepIndex:0,sentAt:new Date().toISOString(),status:'sent',channel:'email'});
          stepExecuted=true;launched++;
        }else{errors++;}
      }else if(step.type==='email'&&!c.email){errors++;}
      else if(step.type==='whatsapp'){
        var waOk=window.seq2QueueWaStep(run,step,c,0);
        run.stepLog.push({stepIndex:0,sentAt:new Date().toISOString(),status:waOk?'wa_pending':'wa_no_phone',channel:'whatsapp',detail:waOk?'En attente d\'envoi manuel (Marketing > WhatsApp)':'Pas de numéro de téléphone valide'});
        stepExecuted=true;launched++;
      }else if(step.type==='wait'){
        run.nextStepAt=new Date(Date.now()+(step.waitDays||3)*86400000).toISOString();
        run.stepLog.push({stepIndex:0,sentAt:new Date().toISOString(),status:'waiting',channel:'wait'});
        run.currentStepIndex=1;stepExecuted=true;launched++;
      }else if(step.type==='task'&&step.taskTitle){
        run.stepLog.push({stepIndex:0,sentAt:new Date().toISOString(),status:'task_created',channel:'task'});
        run.currentStepIndex=1;stepExecuted=true;launched++;
      }else if(step.type==='stage_move'){
        funnelMoveTo(PIPELINE.find(function(f){return f.contactId===c.id;})&&PIPELINE.find(function(f){return f.contactId===c.id;}).id||'',step.stageTarget);
        run.stepLog.push({stepIndex:0,sentAt:new Date().toISOString(),status:'stage_moved',channel:'funnel'});
        run.currentStepIndex=1;stepExecuted=true;launched++;
      }else if(step.type==='tag'){
        run.stepLog.push({stepIndex:0,sentAt:new Date().toISOString(),status:'tag_applied',channel:'tag'});
        run.currentStepIndex=1;stepExecuted=true;launched++;
      }else if(step.type==='condition'){
        run.currentStepIndex=1;stepExecuted=true;launched++;
      }
      if(!stepExecuted&&step.type!=='email'){run.currentStepIndex=1;launched++;}
      /* Calculate next step */
      if(seq.steps.length>1&&run.currentStepIndex<seq.steps.length){
        var nextStep=seq.steps[run.currentStepIndex];
        var delay=nextStep.type==='wait'?(nextStep.waitDays||3):(nextStep.delay||3);
        if(run.currentStepIndex===0||nextStep.type!=='wait'){
          run.nextStepAt=new Date(Date.now()+delay*86400000).toISOString();
        }
      }else{run.status='completed';run.nextStepAt=null;}
      SEQ2_RUNS.push(run);
      /* Update funnel: link sequence to contact */
      var fEntry=PIPELINE.find(function(f){return f.contactId===c.id;});
      if(fEntry){fEntry.activeSequenceId=seqId;fEntry.activeSequenceRunId=runId;svFunnel();}
    }catch(e){errors++;console.error('[seq2Launch]',e);}
    if(i<contacts.length-1)await new Promise(function(res){setTimeout(res,200);});
  }
  svSeqRuns2();svElog();
  if(S.mkv==='sequences')rMarketingV2();
  else if(S.mkv==='pipeline')rMarketingV2();
  toast(launched+' contact(s) dans la s\u00e9quence'+(errors?' ('+errors+' \u00e9chec'+(errors>1?'s':'')+')':''),'ok');
};

/* ===== V2 SEQUENCE SCHEDULER ===== */
window.seq2Scheduler=async function(){
  if(!gcalHasValidToken())return;
  var now=Date.now();
  var due=SEQ2_RUNS.filter(function(r){return r.status==='active'&&r.nextStepAt&&new Date(r.nextStepAt).getTime()<=now;});
  if(!due.length)return;
  var signature=window.MK_SIGNATURE||'';
  var didSomething=false;
  for(var i=0;i<due.length;i++){
    var run=due[i];
    var seq=SEQ2.find(function(s){return s.id===run.sequenceId;});
    if(!seq||!seq.steps||run.currentStepIndex>=seq.steps.length){run.status='completed';run.nextStepAt=null;svSeqRuns2();didSomething=true;continue;}
    if(seq.enabled===false){run.status='paused';svSeqRuns2();didSomething=true;continue;}
    var step=seq.steps[run.currentStepIndex];
    /* Per-step condition evaluation */
    if(step.conditionType&&step.conditionType!=='always'){
      var condMet=true;
      var condType=step.conditionType;
      var condStepId=step.conditionStepId||'';
      var condValue=step.conditionValue||'';
      var stepLog=run.stepLog||[];
      if(condType==='email_opened'){
        if(condStepId){
          var refIdx=-1;seq.steps.forEach(function(s,pi){if(s.id===condStepId)refIdx=pi;});
          var refLog=stepLog.find(function(l){return l.stepIndex===refIdx&&l.channel==='email';});
          if(!refLog||refLog.status!=='opened')condMet=false;
        }else{condMet=false;}
      }else if(condType==='email_replied'){
        if(condStepId){
          var refIdx2=-1;seq.steps.forEach(function(s,pi){if(s.id===condStepId)refIdx2=pi;});
          var refLog2=stepLog.find(function(l){return l.stepIndex===refIdx2&&l.channel==='email';});
          if(!refLog2||refLog2.status!=='replied')condMet=false;
        }else{
          var anyReplied=stepLog.some(function(l){return l.channel==='email'&&l.status==='replied';});
          if(!anyReplied)condMet=false;
        }
      }else if(condType==='wa_replied'){
        var waLog=stepLog.find(function(l){return l.channel==='whatsapp'&&l.status==='replied';});
        if(!waLog)condMet=false;
      }else if(condType==='tag_present'){
        if(condValue){
          var c=seq2GetContact(run);
          if(!c||!(c.tags||[]).some(function(t){return t===condValue;}))condMet=false;
        }
      }else if(condType==='stage_is'){
        if(condValue){
          var fe=PIPELINE.find(function(f){return f.contactId===run.contactId;});
          if(!fe||fe.stage!==condValue)condMet=false;
        }
      }
      if(!condMet){
        run.stepLog.push({stepIndex:run.currentStepIndex,sentAt:new Date().toISOString(),status:'skipped',channel:'condition',detail:'Condition non remplie: '+condType});
        run.currentStepIndex++;
        if(run.currentStepIndex>=seq.steps.length){run.status='completed';run.nextStepAt=null;}
        else{
          var skipNext=seq.steps[run.currentStepIndex];
          var skipDelay=skipNext.type==='wait'?(skipNext.waitDays||3):(skipNext.delay||3);
          run.nextStepAt=new Date(Date.now()+skipDelay*86400000).toISOString();
        }
        svSeqRuns2();didSomething=true;continue;
      }
    }
    /* Check global stop rules */
    if(seq.globalRules&&seq.globalRules.stopOnReply){
      var wasReplied=(window.MK_ELOG||[]).some(function(e){return e.sequenceRunId===run.id&&e.replied;});
      if(wasReplied){run.status='completed';run.nextStepAt=null;svSeqRuns2();didSomething=true;continue;}
    }
    try{
      var contact=seq2GetContact(run);
      var stepExecuted=false;
      if(step.type==='email'&&run.contactEmail){
        var c={email:run.contactEmail,firstName:'',lastName:'',company:'',title:''};
        if(contact)c=contact;
        var personalized=mkPersonalizeBody((step.body||'').replace(/\{\{signature\}\}/g,signature),c);
        var encodedSubject=typeof gmailEncodeSubject==='function'?gmailEncodeSubject(step.subject||''):'=?UTF-8?B?'+btoa(unescape(encodeURIComponent(step.subject||'')))+'?=';
        var dateStr=new Date().toUTCString();
        var mimeLines=['To: '+run.contactEmail,'Subject: '+encodedSubject,'Date: '+dateStr,'Content-Type: text/html; charset=UTF-8','MIME-Version: 1.0','',''];
        var rawBody=mimeLines.join('\r\n')+personalized;
        var encoded=btoa(unescape(encodeURIComponent(rawBody))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
        var r=await fetch('https://gmail.googleapis.com/gmail/v1/users/me/messages/send',{method:'POST',headers:{Authorization:'Bearer '+GCAL.token,'Content-Type':'application/json'},body:JSON.stringify({raw:encoded})});
        if(r.ok){
          var sentData=await r.json();
          window.MK_ELOG.push({id:Date.now(),to:run.contactEmail,subject:step.subject,status:'sent',date:new Date().toISOString(),contactName:run.contactName,gmailMessageId:sentData&&sentData.id?sentData.id:'',threadId:sentData&&sentData.threadId?sentData.threadId:'',mode:'sequence',campaignName:'S\u00e9quence: '+seq.name,sequenceId:seq.id,sequenceRunId:run.id});
          run.stepLog.push({stepIndex:run.currentStepIndex,sentAt:new Date().toISOString(),status:'sent',channel:'email'});
          stepExecuted=true;
        }
      }else if(step.type==='whatsapp'){
        var waOk2=window.seq2QueueWaStep(run,step,contact||{phone:'',mobile:'',firstName:'',lastName:'',company:'',title:''},run.currentStepIndex);
        run.stepLog.push({stepIndex:run.currentStepIndex,sentAt:new Date().toISOString(),status:waOk2?'wa_pending':'wa_no_phone',channel:'whatsapp',detail:waOk2?'En attente d\'envoi manuel (Marketing > WhatsApp)':'Pas de numéro de téléphone valide'});
        stepExecuted=true;
      }else if(step.type==='wait'){
        run.stepLog.push({stepIndex:run.currentStepIndex,sentAt:new Date().toISOString(),status:'waiting',channel:'wait'});
        stepExecuted=true;
      }else if(step.type==='stage_move'){
        var fEntry=PIPELINE.find(function(f){return f.contactId===run.contactId;});
        if(fEntry)funnelMoveTo(fEntry.id,step.stageTarget);
        run.stepLog.push({stepIndex:run.currentStepIndex,sentAt:new Date().toISOString(),status:'stage_moved',channel:'funnel'});
        stepExecuted=true;
      }else if(step.type==='tag'&&contact){
        if(step.tagName){
          if(step.tagAction==='add'&&!contact.tags)contact.tags=[];
          if(step.tagAction==='add'&&contact.tags.indexOf(step.tagName)===-1)contact.tags.push(step.tagName);
          if(step.tagAction==='remove'&&contact.tags)contact.tags=contact.tags.filter(function(t){return t!==step.tagName;});
          svData();
        }
        run.stepLog.push({stepIndex:run.currentStepIndex,sentAt:new Date().toISOString(),status:'tag_applied',channel:'tag'});
        stepExecuted=true;
      }else if(step.type==='task'){
        run.stepLog.push({stepIndex:run.currentStepIndex,sentAt:new Date().toISOString(),status:'task_created',channel:'task'});
        stepExecuted=true;
      }else if(step.type==='condition'){
        run.stepLog.push({stepIndex:run.currentStepIndex,sentAt:new Date().toISOString(),status:'condition_eval',channel:'condition'});
        stepExecuted=true;
      }
      if(stepExecuted){
        run.currentStepIndex++;
        if(run.currentStepIndex>=seq.steps.length){run.status='completed';run.nextStepAt=null;}
        else{
          var nextStep=seq.steps[run.currentStepIndex];
          var delay=nextStep.type==='wait'?(nextStep.waitDays||3):(nextStep.delay||3);
          run.nextStepAt=new Date(Date.now()+delay*86400000).toISOString();
        }
        svElog();svSeqRuns2();didSomething=true;
      }
    }catch(e){console.error('[seq2Scheduler]',e);}
  }
  if(didSomething&&S.mkv==='sequences')rMarketingV2();
};
