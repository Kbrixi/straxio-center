window.seq2LaunchSingle=async function(entryId,seqId){
  var entry=PIPELINE.find(function(f){return f.id===entryId;});
  var contact=entry?funnelGetContact(entry):null;
  if(!entry||!contact){toast('Contact introuvable','err');return;}
  var seq=SEQ2.find(function(s){return s.id===seqId;});if(!seq)return;
  clsM();
  var runId=seq2RunId();
  var run={
    id:runId,sequenceId:seqId,sequenceName:seq.name,
    contactId:contact.id,contactEmail:contact.email||'',contactName:contactDisplayName(contact),folderKey:entry.folderKey,
    currentStepId:null,currentStepIndex:0,status:'active',startedAt:new Date().toISOString(),
    nextStepAt:new Date().toISOString(),stepLog:[]
  };
  /* Execute first step */
  var step=seq.steps[0];var signature=window.MK_SIGNATURE||'';
  if(step.type==='email'&&contact.email&&gcalHasValidToken()){
    try{
      var personalized=mkPersonalizeBody((step.body||'').replace(/\{\{signature\}\}/g,signature),contact);
      var encodedSubject=typeof gmailEncodeSubject==='function'?gmailEncodeSubject(step.subject||''):'=?UTF-8?B?'+btoa(unescape(encodeURIComponent(step.subject||'')))+'?=';
      var dateStr=new Date().toUTCString();
      var mimeLines=['To: '+contact.email,'Subject: '+encodedSubject,'Date: '+dateStr,'Content-Type: text/html; charset=UTF-8','MIME-Version: 1.0','',''];
      var rawBody=mimeLines.join('\r\n')+personalized;
      var encoded=btoa(unescape(encodeURIComponent(rawBody))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
      var r=await fetch('https://gmail.googleapis.com/gmail/v1/users/me/messages/send',{method:'POST',headers:{Authorization:'Bearer '+GCAL.token,'Content-Type':'application/json'},body:JSON.stringify({raw:encoded})});
      if(r.ok){
        var sentData=await r.json();
        window.MK_ELOG.push({id:Date.now(),to:contact.email,subject:step.subject,status:'sent',date:new Date().toISOString(),contactName:contactDisplayName(contact),gmailMessageId:sentData&&sentData.id?sentData.id:'',threadId:sentData&&sentData.threadId?sentData.threadId:'',mode:'sequence',campaignName:'S\u00e9quence: '+seq.name,sequenceId:seqId,sequenceRunId:runId});
        run.stepLog.push({stepIndex:0,sentAt:new Date().toISOString(),status:'sent',channel:'email'});
        run.currentStepIndex=1;
        if(seq.steps.length>1){var nd=seq.steps[1].delay||seq.steps[1].waitDays||3;run.nextStepAt=new Date(Date.now()+nd*86400000).toISOString();}
        else{run.status='completed';run.nextStepAt=null;}
        svElog();
      }
    }catch(e){console.error('[seq2PipelineLaunch]',e);}
  }else if(step.type==='whatsapp'){
    /* Lancement depuis un clic direct sur un seul contact : on peut ouvrir
       wa.me immédiatement (le geste utilisateur est encore valide ici). */
    var waPhone=window.waFormatPhone(contact.phone||contact.mobile||'');
    var waMsg=window.seq2BuildWaMessage(step,contact);
    if(waPhone&&waPhone.length>=8){
      window.open('https://wa.me/'+waPhone+'?text='+encodeURIComponent(waMsg),'_blank');
      window.MK_WA_LOG.push({id:Date.now(),campaignId:'seq_'+seqId,campaignName:'S\u00e9quence: '+seq.name,phone:waPhone,contactName:contactDisplayName(contact),message:waMsg,status:'sent',sentAt:new Date().toISOString()});
      svWaLog();
      run.stepLog.push({stepIndex:0,sentAt:new Date().toISOString(),status:'sent',channel:'whatsapp'});
    }else{
      window.seq2QueueWaStep(run,step,contact,0);
      run.stepLog.push({stepIndex:0,sentAt:new Date().toISOString(),status:'wa_no_phone',channel:'whatsapp',detail:'Pas de num\u00e9ro de t\u00e9l\u00e9phone valide'});
      toast('Pas de num\u00e9ro valide pour '+contactDisplayName(contact)+' \u2014 message mis en attente','info');
    }
    run.currentStepIndex=1;
    if(seq.steps.length>1){run.nextStepAt=new Date(Date.now()+(seq.steps[1].delay||3)*86400000).toISOString();}
    else{run.status='completed';run.nextStepAt=null;}
  }else{
    run.currentStepIndex=1;
    if(seq.steps.length>1){run.nextStepAt=new Date(Date.now()+(seq.steps[1].delay||3)*86400000).toISOString();}
    else{run.status='completed';run.nextStepAt=null;}
  }
  SEQ2_RUNS.push(run);svSeqRuns2();
  entry.activeSequenceId=seqId;entry.activeSequenceRunId=runId;
  if(step.type==='stage_move')funnelMoveTo(entryId,step.stageTarget);
  svFunnel();
  toast('S\u00e9quence lanc\u00e9e pour '+contactDisplayName(contact),'ok');
  pipeCloseDetail();rMarketingV2();
};

   Ces taux et seuils évoluent (votations en Suisse, lois de finances en France) — à revérifier
   sur estv.admin.ch et economie.gouv.fr en cas de doute. */
const EXP_JURISDICTIONS=[
{key:'CH',label:'Suisse (AFC)',authority:'AFC',threshold:400,thresholdCur:'CHF',
 vatRates:[
 {key:'8.1',label:'8.1 % (taux normal)'},
 {key:'3.8',label:'3.8 % (hébergement)'},
 {key:'2.6',label:'2.6 % (taux réduit)'},
 {key:'0',label:'0 % (exonéré)'},
 {key:'na',label:'TVA non mentionnée / étranger'}
 ]},
{key:'FR',label:'France (DGFiP)',authority:'DGFiP',threshold:150,thresholdCur:'EUR',
 vatRates:[
 {key:'20',label:'20 % (taux normal)'},
 {key:'10',label:'10 % (restauration, transport, hôtellerie)'},
 {key:'5.5',label:'5.5 % (taux réduit)'},
 {key:'2.1',label:'2.1 % (taux super réduit)'},
 {key:'0',label:'0 % (exonéré)'},

 ]}

function expJur(key){return EXP_JURISDICTIONS.find(j=>j.key===key)||EXP_JURISDICTIONS[0];}
function expVat(jurKey,rateKey){const j=expJur(jurKey);return j.vatRates.find(v=>v.key===rateKey)||j.vatRates[j.vatRates.length-1];}
/* Devise par défaut associée à chaque juridiction, pour préremplir intelligemment le formulaire. */
function expDefaultCurrency(jurKey){return jurKey==='FR'?'EUR':'CHF';}
function expVatAmount(amount,rateKey){const r=parseFloat(rateKey);if(!amount||isNaN(r)||r<=0)return 0;return Math.round((amount-amount/(1+r/100))*100)/100;}
/* Liste les points bloquants qui risquent de faire retoquer la note par le fisc (CH ou FR selon la juridiction choisie). */
function expComplianceIssues(x){
const issues=[];
const jur=expJur(x.jurisdiction||'CH');
if(x.expenseType!=='km'){

if(x.category==='repas'&&!(x.attendees&&x.attendees.trim()))issues.push('Personnes présentes non renseignées (repas d\'affaires)');
return issues;
}

function expStatus(key){return EXP_STATUSES.find(s=>s.key===key)||EXP_STATUSES[0];}
function expFmtAmount(a,cur){return(a||0).toLocaleString('fr-CH',{minimumFractionDigits:2,maximumFractionDigits:2})+' '+(cur||'CHF');}
/* Une note de frais a une devise propre (CHF/EUR/USD) : on ne les additionne jamais

function expSumByCurrency(list){const m={};list.forEach(x=>{const cur=x.currency||'CHF';m[cur]=(m[cur]||0)+(x.amount||0);});return m;}

let _tesseractLoading=null;
function loadTesseract(){
if(window.Tesseract)return Promise.resolve();
if(_tesseractLoading)return _tesseractLoading;
_tesseractLoading=new Promise((resolve,reject)=>{
const s=document.createElement('script');
s.src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';
s.onload=()=>resolve();
s.onerror=()=>reject(new Error('Impossible de charger le module OCR (connexion internet ?)'));

}
/* Prétraitement image avant OCR : niveaux de gris + seuillage automatique (Otsu) + upscale
   des petites images. Améliore nettement la lecture Tesseract sur des tickets flous, sombres
   ou pris en contre-jour, sans dépendance externe. Ne remplace PAS la photo affichée/stockée
   (couleur, compressée) — seulement la version envoyée à l'OCR. */
function preprocessImageForOcr(dataUrl){
return new Promise(resolve=>{
const img=new Image();
img.onload=()=>{
try{
const w=img.naturalWidth,h=img.naturalHeight;
const longSide=Math.max(w,h);
const scale=longSide<1200?Math.min(2,1200/longSide):1;
const nw=Math.max(1,Math.round(w*scale)),nh=Math.max(1,Math.round(h*scale));
const canvas=document.createElement('canvas');
canvas.width=nw;canvas.height=nh;
const ctx=canvas.getContext('2d');
ctx.drawImage(img,0,0,nw,nh);
const imgData=ctx.getImageData(0,0,nw,nh);
const d=imgData.data;
const hist=new Array(256).fill(0);
const gray=new Uint8ClampedArray(nw*nh);
for(let i=0,p=0;i<d.length;i+=4,p++){
const g=Math.round(0.299*d[i]+0.587*d[i+1]+0.114*d[i+2]);
gray[p]=g;hist[g]++;
}
const total=nw*nh;
let sum=0;for(let t=0;t<256;t++)sum+=t*hist[t];
let sumB=0,wB=0,wF=0,maxVar=0,threshold=127;
for(let t=0;t<256;t++){
wB+=hist[t];if(wB===0)continue;
wF=total-wB;if(wF===0)break;
sumB+=t*hist[t];
const mB=sumB/wB,mF=(sum-sumB)/wF;
const varBetween=wB*wF*(mB-mF)*(mB-mF);
if(varBetween>maxVar){maxVar=varBetween;threshold=t;}
}
for(let i=0,p=0;i<d.length;i+=4,p++){
const v=gray[p]>threshold?255:0;
d[i]=d[i+1]=d[i+2]=v;
}
ctx.putImageData(imgData,0,0);
resolve(canvas.toDataURL('image/png'));
}catch(e){resolve(dataUrl);}
};
img.onerror=()=>resolve(dataUrl);
img.src=dataUrl;
});
}
async function ocrExtractText(dataUrl){

const text=(res&&res.data&&res.data.text)||'';
const confidence=(res&&res.data&&typeof res.data.confidence==='number')?res.data.confidence:null;
return{text,confidence};
}
function parseExpenseFromOcr(text){
const res={amount:null,date:'',vendor:'',currency:null};
const lines=(text||'').split(/\n/).map(l=>l.trim()).filter(Boolean);
const amountRegex=/(\d{1,3}(?:[.\s'’]\d{3})*(?:[.,]\d{2}))\s*(chf|eur|€|fr\.?|usd|\$)?/i;
const candidates=[];
lines.forEach(line=>{
const m=line.match(amountRegex);
if(m){
const raw=m[1].replace(/[\s'’]/g,'').replace(',','.');
const val=parseFloat(raw);
if(!isNaN(val)&&val>0&&val<100000){
const boost=/total|montant|net.*payer|à payer|amount due|solde/i.test(line)?1000:0;
let cur=null;
if(m[2]){
const c=m[2].toLowerCase();
if(c==='chf'||c==='fr'||c==='fr.')cur='CHF';
else if(c==='eur'||c==='€')cur='EUR';
else if(c==='usd'||c==='$')cur='USD';
}
candidates.push({val,boost,cur});
}
}
});
if(candidates.length){
candidates.sort((a,b)=>(b.boost-a.boost)||(b.val-a.val));
res.amount=candidates[0].val;
const withCur=candidates.find(c=>c.cur);
res.currency=(withCur&&withCur.cur)||null;
}
const dateRegex=/(\d{2})[.\/-](\d{2})[.\/-](\d{4})|(\d{4})-(\d{2})-(\d{2})/;
for(const line of lines){
const m=line.match(dateRegex);
if(m){res.date=m[1]?`${m[3]}-${m[2]}-${m[1]}`:`${m[4]}-${m[5]}-${m[6]}`;break;}
}
for(const line of lines.slice(0,6)){
if(line.length>=3&&line.length<=40&&!/^\d+$/.test(line)&&!dateRegex.test(line)){res.vendor=line;break;}
}
return res;
}
/* Détection heuristique de la juridiction fiscale à partir du texte OCR : numéro de TVA/UID
   suisse (CHE-xxx.xxx.xxx), "MWST", devise CHF d'une part ; numéro de TVA intracommunautaire
   FRxx, SIRET/SIREN, "€"/EUR d'autre part. Reste silencieuse (null) si ambigu — le champ
   juridiction reste modifiable manuellement dans tous les cas. */
function detectJurisdictionFromOcr(text){
const t=(text||'').toUpperCase();
if(/CHE[-\s]?\d{3}\.?\d{3}\.?\d{3}/.test(t)||/\bMWST\b/.test(t)||/\bCHF\b/.test(t))return'CH';
if(/\bFR\d{2}\s?\d{9,11}\b/.test(t)||/\bSIRET\b/.test(t)||/\bSIREN\b/.test(t)||/€|\bEUR\b/.test(t))return'FR';
return null;
}
/* Recherche une ligne mentionnant la TVA (TVA/MWST/VAT) et tente d'en extraire le taux
   (rapproché du taux valide le plus proche pour la juridiction donnée) et le montant. */
function parseVatFromOcr(text,jurKey){
const res={rateKey:'',amount:null};
const jur=expJur(jurKey||'CH');
/* Retire d'abord les numéros d'identification (UID suisse CHE-xxx.xxx.xxx, TVA intracommunautaire
   FRxx..., SIRET/SIREN) : ces lignes contiennent souvent le mot "TVA" mais leurs chiffres ne sont
   pas un montant — sans ce nettoyage on risque de lire l'UID comme si c'était le montant de TVA. */
const idRegex=/CHE[-\s]?\d{3}\.?\d{3}\.?\d{3}|FR\d{2}\s?\d{9,11}|SIRET[:\s]*[\d\s]{10,17}|SIREN[:\s]*[\d\s]{8,12}|UID[:\s]*CHE[-\s\d.]*|No\.?\s*TVA[:\s]*[A-Z]{0,3}[\d.\s-]{6,}/gi;
const lines=(text||'').split(/\n/).map(l=>l.replace(idRegex,' '));
const vatLineRegex=/tva|mwst|\bvat\b/i;
const pctRegex=/(\d{1,2}(?:[.,]\d{1,2})?)\s*%/;
const amtRegex=/(\d{1,3}(?:[.\s'’]\d{3})*[.,]\d{2})/;
/* Passe 1 : ligne nettoyée qui mentionne la TVA ET un pourcentage — signal fort. Le montant est
   lu sur cette même ligne pour éviter de piocher un nombre sans rapport ailleurs sur le ticket. */
for(const line of lines){
if(res.rateKey)break;
if(!vatLineRegex.test(line))continue;
const pm=line.match(pctRegex);
if(!pm)continue;
const pct=parseFloat(pm[1].replace(',','.'));
let best=null,bestDiff=Infinity;
jur.vatRates.forEach(v=>{
const rv=parseFloat(v.key);
if(!isNaN(rv)){const diff=Math.abs(rv-pct);if(diff<bestDiff){bestDiff=diff;best=v.key;}}
});
if(best===null||bestDiff>0.6)continue;
res.rateKey=best;
const am=line.match(amtRegex);
if(am){
const val=parseFloat(am[1].replace(/[\s'’]/g,'').replace(',','.'));
if(!isNaN(val)&&val>0&&val<100000)res.amount=val;
}
}
/* Passe 2 (repli) : aucun pourcentage trouvé, mais une ligne "dont TVA / montant TVA" avec un
   montant seul — on garde le montant, le taux reste à renseigner manuellement. */
if(!res.rateKey){
for(const line of lines){
if(!vatLineRegex.test(line))continue;
const am=line.match(amtRegex);
if(am){
const val=parseFloat(am[1].replace(/[\s'’]/g,'').replace(',','.'));
if(!isNaN(val)&&val>0&&val<100000){res.amount=val;break;}
}
}
}
return res;
}
function suggestExpenseCategory(text){
const t=(text||'').toLowerCase();
for(const cat in EXP_CAT_KEYWORDS){if(EXP_CAT_KEYWORDS[cat].some(k=>t.includes(k)))return cat;}
return'autre';
}

/* ===== COMPRESSION IMAGE (même principe que handleLogoFile) ===== */
function compressImageFile(file,maxDim,quality){
return new Promise((resolve,reject)=>{
const reader=new FileReader();
reader.onload=e=>{
const img=new Image();
img.onload=()=>{
const w=img.naturalWidth,h=img.naturalHeight;
const scale=Math.min(1,maxDim/Math.max(w,h));
const nw=Math.max(1,Math.round(w*scale)),nh=Math.max(1,Math.round(h*scale));
const canvas=document.createElement('canvas');
canvas.width=nw;canvas.height=nh;
canvas.getContext('2d').drawImage(img,0,0,nw,nh);
resolve(canvas.toDataURL('image/jpeg',quality||0.82));
};
img.onerror=()=>reject(new Error('Image illisible'));
img.src=e.target.result;
};
reader.onerror=()=>reject(new Error('Erreur de lecture du fichier'));
reader.readAsDataURL(file);
});
}

/* ===== STOCKAGE PHOTOS (documents Firestore, même projet que la synchro des données) =====
   Historique : d'abord tenté avec Firebase Storage (abandonné — exige depuis fin 2024 le plan
   payant Blaze pour provisionner un nouveau bucket), puis avec un endpoint PHP sur l'hébergement
   personnel de l'utilisateur (abandonné — bloqué par un pare-feu/WAF au niveau serveur, cause
   jamais identifiée malgré permissions/.htaccess vérifiés). Solution retenue : Firestore, déjà
   utilisé pour synchroniser toutes les autres données, reste utilisable sur le plan gratuit Spark
   (aucune carte bancaire requise, contrairement à Storage) — aucune configuration serveur externe.
   Contrainte : un document Firestore ne peut pas dépasser 1 Mio, donc chaque photo est recompressée
   côté client (fitDataUrlToByteBudget) pour tenir sous cette limite avant d'être stockée en base64
   dans un document dédié (collection crm_photos, un document par photo) — jamais dans le blob
   principal synchronisé (cdc_*), pour ne pas dépasser sa propre limite de 1 Mio. */
/* Exposées sur window : ce module tourne dans une IIFE, mais photoStorageReady/uploadExpensePhoto/
   deleteExpensePhoto/fetchExpensePhotoUrl sont aussi appelées depuis la section Paramètres et les
   modales de notes de frais, certaines définies dans le script principal en dehors de cette IIFE —
   sans window., ces appels lèveraient une ReferenceError "is not defined" (même piège que
   window.setExf découvert précédemment). */
window.photoStorageReady=function(){return!!(FB.app&&FB.db&&FB.uid);};
/* Recompresse une image (dataURL) par paliers jusqu'à tenir sous maxBytes (taille binaire estimée,
   avant l'inflation ~33% du base64) : d'abord en réduisant la qualité JPEG, puis la résolution si
   ça ne suffit pas. Une photo de reçu reste lisible même assez compressée (texte contrasté). */
function fitDataUrlToByteBudget(dataUrl,maxBytes){
return new Promise(function(resolve,reject){
const img=new Image();
img.onload=function(){
let dim=Math.max(img.naturalWidth,img.naturalHeight);
let quality=0.82;
function attempt(){
const scale=Math.min(1,dim/Math.max(img.naturalWidth,img.naturalHeight));
const nw=Math.max(1,Math.round(img.naturalWidth*scale)),nh=Math.max(1,Math.round(img.naturalHeight*scale));
const canvas=document.createElement('canvas');
canvas.width=nw;canvas.height=nh;
canvas.getContext('2d').drawImage(img,0,0,nw,nh);
const out=canvas.toDataURL('image/jpeg',quality);
const b64Len=out.length-(out.indexOf(',')+1);
const approxBytes=b64Len*0.75;
if(approxBytes<=maxBytes||(dim<=400&&quality<=0.35)){resolve(out);return;}
if(quality>0.35)quality=Math.max(0.35,quality-0.12);else dim=Math.round(dim*0.85);
attempt();
}
attempt();
};
img.onerror=function(){reject(new Error('Image illisible'));};
img.src=dataUrl;
});
}
const PHOTO_DOC_BYTE_BUDGET=700*1024;
function photoDocId(expenseId){return FB.uid+'_'+expenseId;}
window.uploadExpensePhoto=async function(expenseId,dataUrl){
if(!photoStorageReady())return null;
const fitted=await fitDataUrlToByteBudget(dataUrl,PHOTO_DOC_BYTE_BUDGET);
const m=/^data:([^;]+);base64,(.*)$/.exec(fitted);
if(!m)throw new Error('Format de photo invalide');
await FB.db.collection('crm_photos').doc(photoDocId(expenseId)).set({ct:m[1],data:m[2],ts:Date.now()});
return{path:String(expenseId),url:'firestore'};
};
window.deleteExpensePhoto=async function(path){
if(!photoStorageReady()||!path)return;
try{await FB.db.collection('crm_photos').doc(photoDocId(path)).delete();}catch(e){/* ignore */}
};
/* Récupère une photo synchronisée mais absente du cache local de cet appareil (cas d'un appareil
   qui n'a pas pris la photo lui-même) : lue à la demande depuis Firestore, jamais mise en cache
   localement de façon permanente (une dizaine de photos à ~700 Ko suffirait à saturer le quota
   localStorage), juste utilisée le temps d'afficher la modale concernée. */
window.fetchExpensePhotoUrl=async function(expenseId){
if(!photoStorageReady())return null;
try{
const snap=await FB.db.collection('crm_photos').doc(photoDocId(expenseId)).get();
if(!snap.exists)return null;
const d=snap.data();
if(!d||!d.data)return null;
return'data:'+(d.ct||'image/jpeg')+';base64,'+d.data;
}catch(e){console.error('[Expenses] lecture photo Firestore échouée',e);return null;}
};
/* Retourne une source d'image utilisable immédiatement (synchrone) : cache local si présent, sinon
   rien — pour le cas "synced mais pas encore récupérée", voir fetchExpensePhotoUrl (asynchrone). */
function expPhotoSrcSync(x){
const local=expGetPendingPhoto(x.id);
if(local)return local;
if(x.photoUrl&&/^(https?:|data:)/.test(x.photoUrl))return x.photoUrl;
return'';
}
window.retryPendingExpensePhotos=async function(silent){
if(!photoStorageReady()){if(!silent)toast('Connecte le cloud (Firebase) dans Paramètres pour envoyer les photos','err');return;}
const pending=EXP.filter(x=>x.photoSyncStatus==='pending');
if(!pending.length){if(!silent)toast('Aucune photo en attente','info');return;}
if(!silent)toast('Envoi de '+pending.length+' photo(s) en cours...','info');
let ok=0,lastErr=null;
for(const exp of pending){
const dataUrl=expGetPendingPhoto(exp.id);
if(!dataUrl)continue;
try{
const up=await uploadExpensePhoto(exp.id,dataUrl);
if(up){exp.photoPath=up.path;exp.photoUrl=up.url;exp.photoSyncStatus='synced';expClearPendingPhoto(exp.id);ok++;}
}catch(err){console.error('[Expenses] retry upload erreur',err);lastErr=err;}
}
/* IMPORTANT : ne persister/pousser vers le cloud QUE si quelque chose a réellement changé (ok>0).
   Cette fonction est appelée automatiquement à CHAQUE synchronisation reçue d'un autre appareil
   (via _onExpensesSynced), pour n'importe quelle donnée du CRM — pas seulement les notes de frais.
   Avant ce correctif, svExpenses() était appelée ici sans condition, y compris quand ok===0 (aucun
   envoi réussi, ou aucune photo à réessayer trouvée localement). Résultat : sur un appareil ayant
   des photos bloquées en attente (ex. anciennes tentatives Firebase Storage/LWS échouées), chaque
   synchronisation reçue déclenchait un re-push de l'intégralité des données de cet appareil — even
   quand rien n'avait changé. Si une édition/suppression était faite sur un AUTRE appareil pendant
   ce court laps de temps (le temps d'essayer d'envoyer plusieurs photos), ce re-push écrasait la
   modification plus récente avec une copie locale plus ancienne : symptôme observé par l'utilisateur
   ("les notes de frais modifiées/supprimées sur desktop reviennent, renvoyées par le mobile"). */
if(ok>0){svExpenses();if(S.v==='expenses')rExpenses();}
/* L'erreur exacte (code Firebase Storage) est affichée plutôt que juste "échec" — sans ça,
   impossible de diagnostiquer depuis un mobile sans console développeur (bucket non activé,
   règles de sécurité Storage manquantes, etc. donnent des codes différents et distinctifs). */
if(ok===pending.length){toast(ok+' photo(s) synchronisée(s)','ok');}
else{toast(ok+' photo(s) synchronisée(s) · '+(pending.length-ok)+' échec(s) : '+(lastErr?(lastErr.code||lastErr.message||lastErr):'raison inconnue'),'err');}
};
/* Relance automatique quand une sync cloud arrive (connexion, reconnexion...) */
window._onExpensesSynced=function(){if(photoStorageReady())retryPendingExpensePhotos(true);if(S.v==='expenses')rExpenses();};

window.handleExpensePhoto=function(input){
const file=input.files&&input.files[0];
if(!file)return;
const statusEl=document.getElementById('expOcrStatus');

let ocrImgForDebug=null;
compressImageFile(file,1600,0.82).then(dataUrl=>{

}).then(ocrImg=>{
ocrImgForDebug=ocrImg;
if(statusEl)statusEl.textContent='Analyse OCR en cours (peut prendre quelques secondes)...';
return ocrExtractText(ocrImg);

if(parsed.date&&dateEl){dateEl.value=parsed.date;flash(dateEl);}

if(detectedJur&&jurEl&&jurEl.value!==detectedJur){jurEl.value=detectedJur;flash(jurEl);if(typeof window.expOnJurisdictionChange==='function')window.expOnJurisdictionChange();}
const finalJur=jurEl?jurEl.value:'CH';
const vat=parseVatFromOcr(text,finalJur);
const vatRateEl=document.getElementById('expVatRate'),vatAmtEl=document.getElementById('expVatAmount');
if(vat.rateKey&&vatRateEl){vatRateEl.value=vat.rateKey;flash(vatRateEl);}
if(vat.amount&&vatAmtEl){vatAmtEl.value=vat.amount;vatAmtEl.dataset.manual='1';flash(vatAmtEl);if(typeof window.expRecalcHt==='function')window.expRecalcHt();}
if(typeof window.expCheckThreshold==='function')window.expCheckThreshold();
let confTxt,confCls;
if(confidence===null){confTxt='OCR terminé — vérifie les champs ci-dessous avant d\'enregistrer.';confCls='text-mut';}
else if(confidence>=80){confTxt='Confiance OCR élevée ('+Math.round(confidence)+'%) — vérifie quand même les champs surlignés.';confCls='text-ok';}
else if(confidence>=50){confTxt='Confiance OCR moyenne ('+Math.round(confidence)+'%) — vérifie les champs avant d\'enregistrer.';confCls='text-warn';}
else{confTxt='Confiance OCR faible ('+Math.round(confidence)+'%) — la photo est peut-être floue ou mal cadrée, vérifie tous les champs.';confCls='text-acc';}
if(statusEl)statusEl.innerHTML='<span class="'+confCls+'">'+confTxt+'</span>';
const rawWrap=document.getElementById('expOcrRawWrap'),rawText=document.getElementById('expOcrRawText');
if(rawWrap)rawWrap.classList.remove('hidden');
if(rawText)rawText.textContent=text&&text.trim()?text:'(aucun texte détecté)';
}).catch(err=>{
console.error('[Expenses] OCR erreur',err,ocrImgForDebug?'(prétraitement ok)':'(prétraitement non atteint)');
if(statusEl)statusEl.textContent='OCR indisponible (hors-ligne ?) — remplis les champs manuellement.';
});
};

window.svExpense=async function(e){
e.preventDefault();
const f=new FormData(e.target);
const id=f.get('id')?parseInt(f.get('id'),10):null;
const typeEl=e.target.querySelector('input[name="expenseType"]:checked');
const data={
expenseType:typeEl?typeEl.value:'achat',
jurisdiction:f.get('jurisdiction')||'CH',
date:f.get('date')||todayStr(),
amount:parseFloat(String(f.get('amount')||'0').replace(',','.'))||0,
currency:f.get('currency')||'CHF',
vendor:(f.get('vendor')||'').trim(),
category:f.get('category')||'autre',
folder:f.get('folder')||null,
refNumber:(f.get('refNumber')||'').trim(),
attendees:(f.get('attendees')||'').trim(),
vatRate:f.get('vatRate')||'',
vatAmount:parseFloat(String(f.get('vatAmount')||'0').replace(',','.'))||0,
fullInvoice:f.get('fullInvoice')==='on',
km:parseFloat(f.get('km')||'')||0,
kmRate:parseFloat(f.get('kmRate')||'')||0,
note:(f.get('note')||'').trim(),
status:f.get('status')||'a_traiter'
};
if(data.expenseType==='km'){
const kmEl=document.getElementById('expKm'),kmRateEl=document.getElementById('expKmRate');
data.km=parseFloat(kmEl&&kmEl.value)||0;
data.kmRate=parseFloat(kmRateEl&&kmRateEl.value)||0;
data.vatRate='';data.vatAmount=0;data.fullInvoice=false;
if(!data.km){toast('Indique la distance parcourue','err');return;}
}
if(!data.vendor){toast(data.expenseType==='km'?'Indique au moins le trajet / la destination':'Indique au moins un fournisseur','err');return;}
if(!data.note){toast('Le motif professionnel est obligatoire (exigé en cas de contrôle fiscal)','err');return;}
let exp,isNew=false;
if(id){exp=EXP.find(x=>x.id===id);if(exp)Object.assign(exp,data);}
if(!exp){isNew=true;exp=Object.assign({id:gid(EXP),ocrText:'',photoPath:'',photoUrl:'',photoSyncStatus:'none',createdAt:Date.now()},data);EXP.push(exp);}
const pending=_pendingExpensePhoto;
_pendingExpensePhoto=null;
if(pending&&pending.ocrText)exp.ocrText=pending.ocrText;
const hasPendingPhoto=!!(pending&&pending.dataUrl);
/* Important : on met de côté la photo en attente et on sauvegarde AVANT d'appeler ren().
   Si le rendu échoue pour une raison quelconque (ex. Chart.js pas encore chargé), la note de
   frais et sa photo sont déjà persistées — rien n'est perdu. */
if(hasPendingPhoto){
expSavePendingPhoto(exp.id,pending.dataUrl);
exp.photoSyncStatus='pending';
}
svExpenses();
try{clsM();ren();}catch(renderErr){console.error('[Expenses] Erreur de rendu après sauvegarde (les données sont bien enregistrées) :',renderErr);}
toast(isNew?'Note de frais ajoutée':'Note de frais modifiée');
if(hasPendingPhoto){
if(photoStorageReady()){
try{
const up=await uploadExpensePhoto(exp.id,pending.dataUrl);
if(up){exp.photoPath=up.path;exp.photoUrl=up.url;exp.photoSyncStatus='synced';expClearPendingPhoto(exp.id);svExpenses();if(S.v==='expenses')rExpenses();toast('Photo synchronisée sur le cloud','ok');}
}catch(err){console.error('[Expenses] upload erreur',err);toast('Photo gardée sur cet appareil — l\'envoi a échoué ('+(err.code||err.message||err)+'), nouvelle tentative plus tard','err');}
}else{
toast('Connecte le cloud (Firebase) dans Paramètres pour synchroniser cette photo : elle reste sur cet appareil pour l\'instant','info');
}
}
};

/* ===== DÉTAIL / STATUT / SUPPRESSION ===== */
window.openExpenseDetailM=function(id){
const x=EXP.find(e=>e.id===id);if(!x)return;
const c=expCat(x.category);
const jur=expJur(x.jurisdiction||'CH');
const isKm=x.expenseType==='km';
const photoSrc=expPhotoSrcSync(x);
const photoPendingRemote=!photoSrc&&x.photoSyncStatus==='synced';
const issues=expComplianceIssues(x);
opM(`<div class="p-6">
<div class="flex items-start justify-between mb-4"><h2 class="font-disp font-bold text-lg">${escHtml(x.vendor)||'Note de frais'}</h2><button onclick="clsM()" class="w-8 h-8 rounded-lg hover:bg-sHov flex items-center justify-center text-mut"><i class="fa-solid fa-xmark"></i></button></div>
${issues.length?`<div class="bg-accS text-acc text-xs rounded-lg p-3 mb-4"><i class="fa-solid fa-triangle-exclamation mr-1"></i><b>À corriger avant contrôle fiscal (${jur.authority}) :</b><ul class="list-disc list-inside mt-1">${issues.map(i=>`<li>${escHtml(i)}</li>`).join('')}</ul></div>`:`<div class="bg-okS text-ok text-xs rounded-lg p-3 mb-4"><i class="fa-solid fa-circle-check mr-1"></i>Conforme aux exigences ${jur.authority}</div>`}
${isKm?'':(photoSrc?`<img id="expDetailPhoto" src="${photoSrc}" class="w-full max-h-80 object-contain rounded-lg border border-bdr mb-4 bg-black/40" alt="Facture">`:(photoPendingRemote?'<div id="expDetailPhoto" class="w-full h-24 rounded-lg border border-bdr mb-4 flex items-center justify-center text-mut text-xs"><i class="fa-solid fa-spinner fa-spin mr-2"></i>Chargement de la photo…</div>':'<div id="expDetailPhoto" class="w-full h-24 rounded-lg border border-bdr mb-4 flex items-center justify-center text-mut text-xs">Pas de photo</div>'))}
<div class="grid grid-cols-2 gap-3 text-sm mb-4">
<div><div class="text-[.65rem] text-mut uppercase">Montant</div><div class="font-disp font-bold">${expFmtAmount(x.amount,x.currency)}</div></div>
<div><div class="text-[.65rem] text-mut uppercase">Date</div><div>${fmtFr(x.date)}</div></div>
<div><div class="text-[.65rem] text-mut uppercase">Catégorie</div><div><i class="fa-solid ${c.icon} mr-1"></i>${c.label}</div></div>
<div><div class="text-[.65rem] text-mut uppercase">Dossier</div><div>${x.folder&&fldr(x.folder)?escHtml(fldr(x.folder).name):'—'}</div></div>
<div><div class="text-[.65rem] text-mut uppercase">Juridiction</div><div>${jur.label}</div></div>
<div><div class="text-[.65rem] text-mut uppercase">Réf. facture</div><div>${x.refNumber?escHtml(x.refNumber):'—'}</div></div>
${isKm?`<div><div class="text-[.65rem] text-mut uppercase">Distance</div><div>${x.km} km × ${x.kmRate} ${x.currency}/km</div></div>`:`<div><div class="text-[.65rem] text-mut uppercase">TVA</div><div>${x.vatRate&&x.vatRate!=='na'?expVat(x.jurisdiction||'CH',x.vatRate).label+' — '+expFmtAmount(x.vatAmount,x.currency):(x.vatRate==='na'?'Non mentionnée':'—')}</div></div>
<div><div class="text-[.65rem] text-mut uppercase">Montant HT</div><div>${expFmtAmount((x.amount||0)-(x.vatAmount||0),x.currency)}</div></div>
<div><div class="text-[.65rem] text-mut uppercase">Facture complète</div><div>${x.fullInvoice?'Oui':'Non'}</div></div>`}
</div>
${x.attendees?`<div class="text-xs text-mut mb-3"><span class="uppercase text-[.6rem]">Personnes présentes</span><br>${escHtml(x.attendees)}</div>`:''}
${x.note?`<div class="text-xs text-mut mb-4"><span class="uppercase text-[.6rem]">Motif professionnel</span><br>${escHtml(x.note)}</div>`:''}
${x.ocrText?`<details class="mb-4"><summary class="text-[.65rem] text-mut cursor-pointer uppercase">Texte OCR brut</summary><pre class="text-[.65rem] text-mut whitespace-pre-wrap mt-2 bg-sAlt p-2 rounded-lg max-h-32 overflow-y-auto">${escHtml(x.ocrText)}</pre></details>`:''}
<div class="flex flex-wrap gap-2 mb-2">
${EXP_STATUSES.map(s=>`<button onclick="expSetStatus(${x.id},'${s.key}')" class="chip ${x.status===s.key?'act':''}">${s.label}</button>`).join('')}
</div>
<div class="flex justify-between gap-3 mt-4">
<button onclick="delExpense(${x.id})" class="h-10 px-4 rounded-xl bg-accS text-acc text-sm font-medium hover:bg-accS/70 transition-colors bp"><i class="fa-solid fa-trash mr-1"></i>Supprimer</button>
<button onclick="clsM();openExpenseCaptureM(${x.id})" class="h-10 px-4 rounded-xl bg-sAlt border border-bdr text-sm font-medium hover:bg-sHov transition-colors bp"><i class="fa-solid fa-pen mr-1"></i>Modifier</button>
</div>
</div>`);
if(photoPendingRemote){
fetchExpensePhotoUrl(x.id).then(function(url){
const el=document.getElementById('expDetailPhoto');
if(!el)return;
if(url){const img=document.createElement('img');img.id='expDetailPhoto';img.src=url;img.className='w-full max-h-80 object-contain rounded-lg border border-bdr mb-4 bg-black/40';img.alt='Facture';el.replaceWith(img);}
else{el.innerHTML='<i class="fa-solid fa-triangle-exclamation mr-2"></i>Photo introuvable';}
});
}
};
window.expSetStatus=function(id,status){const x=EXP.find(e=>e.id===id);if(!x)return;x.status=status;svExpenses();clsM();if(S.v==='expenses')rExpenses();toast('Statut mis à jour');};
window.delExpense=function(id){
if(!confirm('Supprimer cette note de frais ? La photo associée sera aussi supprimée du cloud.'))return;
const x=EXP.find(e=>e.id===id);
if(x&&x.photoPath)deleteExpensePhoto(x.photoPath);
if(x)expClearPendingPhoto(x.id);
EXP=EXP.filter(e=>e.id!==id);
svExpenses();clsM();if(S.v==='expenses')rExpenses();
toast('Note de frais supprimée','info');
};

/* ===== EXPORT CSV (pour comptabilité / remboursement) ===== */
window.expExportCsv=function(){
const list=filteredExpenses();
if(!list.length){toast('Rien à exporter avec ce filtre','info');return;}
const rows=[['Date','Type','Fournisseur','Montant','Devise','Catégorie','Statut','Dossier','Juridiction','N° référence','Taux TVA','Montant TVA','Montant HT','Distance (km)','Personnes présentes','Motif professionnel','Conforme']];
list.forEach(x=>{
const jur=expJur(x.jurisdiction||'CH');
const isKm=x.expenseType==='km';
rows.push([
x.date,
isKm?'Kilométrique':'Achat',
x.vendor,
x.amount,
x.currency,
expCat(x.category).label,
expStatus(x.status).label,
x.folder&&fldr(x.folder)?fldr(x.folder).name:'',
jur.label,
x.refNumber||'',
(!isKm&&x.vatRate)?expVat(x.jurisdiction||'CH',x.vatRate).label:'',
(!isKm&&x.vatAmount)?x.vatAmount:'',
isKm?'':(((x.amount||0)-(x.vatAmount||0)).toFixed(2)),
isKm?(x.km||''):'',
x.attendees||'',
x.note||'',
expIsCompliant(x)?'Oui':'Non'
]);
});
const csv=rows.map(r=>r.map(v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"').join(';')).join('\n');
const blob=new Blob(['﻿'+csv],{type:'text/csv;charset=utf-8'});
const url=URL.createObjectURL(blob);
downloadBlob(url,'notes_de_frais_'+todayStr()+'.csv');
setTimeout(()=>URL.revokeObjectURL(url),2000);
};

console.log('[Expenses Module] Loaded —',EXP.length,'notes de frais');
})();
</script>
